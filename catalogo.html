<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — Codekeeb</title>
<meta name="description" content="Los cinco teclados split de Codekeeb con precio, existencias y ficha completa. Filtra por inalámbrico, low profile, MX o encoder.">
<link rel="canonical" href="https://codekeeb.github.io/catalogo.html">
<meta property="og:type" content="website">
<meta property="og:url" content="https://codekeeb.github.io/catalogo.html">
<meta property="og:site_name" content="Codekeeb">
<meta property="og:title" content="Elige tu split — Codekeeb">
<meta property="og:description" content="Los cinco teclados split de Codekeeb con precio, existencias y ficha completa. Filtra por inalámbrico, low profile, MX o encoder.">
<meta property="og:image" content="https://codekeeb.github.io/assets/img/products/sofle-carbon.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Elige tu split — Codekeeb">
<meta name="twitter:description" content="Los cinco teclados split de Codekeeb con precio, existencias y ficha completa. Filtra por inalámbrico, low profile, MX o encoder.">
<meta name="twitter:image" content="https://codekeeb.github.io/assets/img/products/sofle-carbon.jpg">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#fbfbf9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Martian+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/catalogo.css">
</head>
<body>

<header class="top">
  <div class="top__in envoltura">
    <a class="marca" href="/">CODE<i>/</i>KEEB</a>
    <span class="top__sp"></span>
    <div class="idiomas" role="group" aria-label="Idioma">
      <button data-lang-btn="es">ES</button>
      <button data-lang-btn="en">EN</button>
      <button data-lang-btn="fr">FR</button>
    </div>
    <a class="btn btn--solido" href="comparar.html"><span data-t="d.compare">Compara los cinco</span></a>
  </div>
</header>

<main>
  <!-- Primera pantalla: titulo, una linea de contexto y los filtros.
       No hay heroe de producto: el primer objeto que ves es la rejilla. -->
  <section class="entrada envoltura">
    <h1 class="entra entra--titulo" data-t="d.choose">Elige tu split</h1>
    <p class="entra entra--texto" style="--d:1" data-t="d.lede"></p>
    <div class="filtros entra entra--texto" style="--d:2" id="filtros" role="group"></div>
  </section>

  <section class="envoltura">
    <div class="rejilla" id="rejilla"></div>
  </section>
</main>

<footer class="cierre">
  <div class="envoltura">
    <div class="confianza" id="confianza"></div>
  </div>
  <div class="envoltura">
    <div class="herramienta">
      <h2 data-t-html="studio.title"></h2>
      <a class="btn btn--linea" href="keymap-studio/" data-t="studio.cta"></a>
      <p data-t="studio.note"></p>
    </div>
  </div>
  <div class="envoltura">
    <div class="pie">
      <p class="nota" id="nota"></p>
      <p data-t="footer.copy"></p>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/tienda.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  let filtro = "all";

  const FILTROS = [["all","d.all"],["wireless","d.wireless"],["low","d.low"],["mx","d.mx"],["encoder","d.encoder"]];

  /* Los cuatro datos son los mismos en las cinco fichas aunque el
     catalogo no los traiga todos: si falta uno se pone una raya, que
     dice mas que esconder la fila y descuadrar la comparacion. */
  const CUATRO = ["Teclas", "Switches", "Conexión", "Firmware"];

  function tarjeta(p, i) {
    const est = CK.stock(p);
    const desde = p.priceFrom != null && p.priceFull != null && p.priceFrom < p.priceFull;
    const datos = CUATRO.map(k => {
      const etiqueta = (p.specs || []).find(s => s[0].es === k);
      const clave = etiqueta ? CK.L(etiqueta[0]) : k;
      return `<div><dt>${CK.escapar(clave)}</dt><dd>${CK.escapar(CK.spec(p, k) || "—")}</dd></div>`;
    }).join("");

    return `
      <article class="ficha entra entra--ficha" style="--d:${Math.min(i, 4)}">
        <div class="ficha__foto">
          <img src="${CK.foto(p)}" alt="${CK.escapar(p.name)}" data-foco="${p.foco ?? 50}"
               loading="${i < 2 ? "eager" : "lazy"}">
          <span class="ficha__ref mono">${String(i + 1).padStart(2, "0")}</span>
        </div>
        <div class="ficha__cuerpo">
          <h2 class="nombre">${CK.rotulo(p)}</h2>
          <p class="sub">${CK.escapar(CK.L(p.desc) || "")}</p>
          <div class="precio">
            ${desde ? `<span class="precio__desde">${CK.t("price.from")}</span>` : ""}
            <span class="precio__n">${CK.precio(p.priceFrom ?? p.priceFull)}</span>
            ${p.priceOriginal ? `<s class="precio__antes">${CK.precio(p.priceOriginal)}</s>` : ""}
            ${p.discountPct ? `<span class="precio__off mono">−${p.discountPct}%</span>` : ""}
          </div>
          <p class="estado ${est.clase}">${CK.escapar(est.txt)}</p>
          <dl class="datos">${datos}</dl>
          <div class="acciones">
            <a class="btn btn--linea" href="modelo.html?id=${p.id}">${CK.t("models.details")}</a>
            <a class="btn btn--solido" href="${p.url}" target="_blank" rel="noopener">${CK.t("models.view")}</a>
          </div>
        </div>
      </article>`;
  }

  function pintar() {
    $("#nota").textContent = CK.notaPrecios();

    $("#filtros").innerHTML = FILTROS
      .map(([id, k]) => `<button data-f="${id}" aria-pressed="${id === filtro}">${CK.t(k)}</button>`)
      .join("") + `<span class="cuenta" id="cuenta"></span>`;
    $("#filtros").querySelectorAll("[data-f]").forEach(b =>
      b.onclick = () => { filtro = b.dataset.f; pintar(); });

    const lista = CK.productos().filter(CK.FILTROS[filtro]);
    $("#cuenta").textContent = `${lista.length} ${CK.t("d.of")} ${CK.productos().length}`;
    $("#rejilla").innerHTML = lista.length
      ? lista.map(tarjeta).join("")
      : `<p class="sub">${CK.t("d.nomatch")}</p>`;

    $("#confianza").innerHTML = [
      ["trust.shipping","trust.shippingText"],["trust.warranty","trust.warrantyText"],
      ["trust.custom","trust.customText"],["trust.firmware","trust.firmwareText"],
    ].map(([a,b],i)=>`<div class="entra entra--texto" style="--d:${i}"><h3>${CK.t(a)}</h3><p>${CK.t(b)}</p></div>`).join("");

    CK.encuadrarTodo();
    CK.observarEntradas();
  }

  CK.pintarIdioma(pintar);
  pintar();
})();
</script>
</body>
</html>
