<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codekeeb — Teclados split ergonómicos hechos a mano</title>
<meta name="description" content="Cinco teclados split ergonómicos montados y probados a mano: Sofle Choc, Totem y Corne. Presoldados, hotswap, firmware abierto y un editor propio para reprogramarlos sin instalar nada.">

<meta property="og:type" content="website">

<meta property="og:site_name" content="Codekeeb">
<meta property="og:title" content="Codekeeb — Teclados split ergonómicos">

<meta name="twitter:title" content="Codekeeb — Teclados split ergonómicos">
<meta name="twitter:description" content="Cinco teclados split ergonómicos montados y probados a mano: Sofle Choc, Totem y Corne. Presoldados, hotswap, firmware abierto y un editor propio para reprogramarlos sin instalar nada.">
<meta name="twitter:image" content="https://codekeeb.github.io/assets/img/products/sofle-retro.jpg">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<header class="top">
  <div class="top__in env">
    <a class="marca" href="/">CODE<i>/</i>KEEB</a>
    <nav class="top__nav">
      <a href="#rgb" data-t="p.navVentajas">Ventajas</a>
      <a href="#cinco" data-t="p.losCinco">Los cinco</a>
      <a href="comparar.html" data-t="d.compare">Comparar</a>
    </nav>
    <span class="top__sp"></span>
    <div class="idiomas" role="group" aria-label="Idioma">
      <button data-lang-btn="es">ES</button>
      <button data-lang-btn="en">EN</button>
      <button data-lang-btn="fr">FR</button>
    </div>
    <a class="btn" href="catalogo.html" data-t="d.choose">Elige tu split</a>
  </div>
</header>

<main>

  <!-- ============ 1 · HERO ============
       Una sola foto, enmarcada (nunca a sangre), del modelo destacado, y
       el texto encima apoyado en la banda de mesa vacia de arriba. El
       recorte lo calcula `CK.encuadrarTodo()` con el `foco` medido de la
       foto; ver el comentario del heroe en portada.css.

       Sin rotulo sobre el titular: el titular se sostiene solo. -->
  <section class="hero env">
    <figure class="escenario entra entra--pieza">
      <img id="heroImg" alt="" width="1200" height="838" data-foco="63" data-encaje="60" fetchpriority="high">
      <figcaption class="escenario__texto">
        <h1 class="titular entra entra--titulo" style="--d:1" data-t-html="p.heroTitle"></h1>
        <p class="bajada entra entra--texto" style="--d:2" data-t="p.heroText"></p>
        <span class="acciones entra entra--texto" style="--d:3">
          <a class="btn" href="catalogo.html" data-t="p.heroCta"></a>
          <a class="btn btn--claro" href="comparar.html" data-t="p.heroCta2"></a>
        </span>
      </figcaption>
      <a class="chapa" id="chapa" target="_blank" rel="noopener"></a>
    </figure>
  </section>

  <!-- ============ 2 · RGB, con el teclado fijado ============
       El producto se queda quieto y los argumentos pasan a su lado,
       encendiendose de uno en uno. Es el momento conducido de la pagina. -->
  <section class="fijada" id="rgb">
    <div class="fijada__in env">
      <div class="fijada__lienzo">
        <div class="esquema">
          <div class="kb">
            <div class="kb__luz" aria-hidden="true"></div>
            <div class="kb__placa" id="kbPlaca" aria-hidden="true"></div>
          </div>
          <p class="esquema__nota" data-t="p.demoNota"></p>
        </div>
      </div>
      <div class="fijada__pasos">
        <div class="paso"><p data-t-html="p.rgbTitle"></p></div>
        <div class="paso"><p data-t="p.paso1"></p></div>
        <div class="paso"><p data-t="p.paso2"></p></div>
        <div class="paso"><p data-t="p.paso3"></p></div>
        <div class="paso"><p data-t="p.paso4"></p></div>
      </div>
    </div>
  </section>

  <!-- ============ 3 · OLED ============ -->
  <section class="escena escena--noche">
    <div class="env centro" style="display:grid;gap:clamp(30px,6svh,64px);justify-items:center">
      <div class="centro">
        <span class="rotulo entra entra--rotulo" data-t="p.oledLabel"></span>
        <h2 class="titular entra entra--titulo" style="--d:1;margin-top:14px" data-t-html="p.oledTitle"></h2>
      </div>
      <div class="esquema entra entra--pieza" style="--d:2">
        <div class="oled" aria-hidden="true">
          <div class="oled__v"><small>Bat</small><b>82%</b><span class="oled__bar"><i></i></span></div>
          <div class="oled__v"><small>Capa</small><b>2</b></div>
          <div class="oled__v"><small>WPM</small><b>96</b></div>
          <div class="oled__v"><span class="gato"><span class="gato__cara"><i class="gato__ojo gato__ojo--i"></i><i class="gato__ojo gato__ojo--d"></i></span><i></i><i></i><span class="gato__mesa"></span></span><small>Bongo Cat</small></div>
        </div>
        <p class="esquema__nota" data-t="p.demoNota"></p>
      </div>
      <p class="bajada centro entra entra--texto" style="--d:3" data-t="p.oledText"></p>
    </div>
  </section>

  <!-- ============ 4 · CAPAS ============ -->
  <section class="escena escena--noche">
    <div class="env centro" style="display:grid;gap:clamp(30px,6svh,64px);justify-items:center">
      <div class="centro">
        <span class="rotulo entra entra--rotulo" data-t="p.capasLabel"></span>
        <h2 class="titular entra entra--titulo" style="--d:1;margin-top:14px" data-t-html="p.capasTitle"></h2>
      </div>
      <div class="esquema entra entra--pieza" style="--d:2">
        <div class="capas">
          <div id="capasFila" aria-hidden="true"></div>
          <p class="capas__pie" aria-hidden="true">
            <span data-t="p.capasLabel"></span><b><span>1</span><span>2</span></b>
          </p>
        </div>
        <p class="esquema__nota" data-t="p.demoNota"></p>
      </div>
      <p class="bajada centro entra entra--texto" style="--d:3" data-t="p.capasText"></p>
    </div>
  </section>

  <!-- ============ 5 · HOTSWAP ============ -->
  <section class="escena escena--noche">
    <div class="env centro" style="display:grid;gap:clamp(30px,6svh,64px);justify-items:center">
      <div class="centro">
        <span class="rotulo entra entra--rotulo" data-t="p.hotLabel"></span>
        <h2 class="titular entra entra--titulo" style="--d:1;margin-top:14px" data-t-html="p.hotTitle"></h2>
      </div>
      <div class="esquema entra entra--pieza" style="--d:2">
        <div class="hot" aria-hidden="true">
          <div class="hot__col">
            <span class="hot__hueco">
              <span class="hot__socket"><i></i><i></i></span>
              <span class="hot__sw"></span>
            </span>
            <span class="hot__et">Choc Red</span>
          </div>
          <div class="hot__col">
            <span class="hot__hueco">
              <span class="hot__socket"><i></i><i></i></span>
              <span class="hot__sw hot__sw--marron" style="animation-delay:calc(var(--loop-tecla) / 2)"></span>
            </span>
            <span class="hot__et">MMD Holy Panda</span>
          </div>
        </div>
        <p class="esquema__nota" data-t="p.demoNota"></p>
      </div>
      <p class="bajada centro entra entra--texto" style="--d:3" data-t="p.hotText"></p>
    </div>
  </section>

  <!-- ============ 6 · LOS CINCO ============
       Carril horizontal con las fotos apoyadas, sin tarjetas. -->
  <section class="escena escena--carta" id="cinco">
    <div class="env">
      <div class="centro">
        <span class="rotulo entra entra--rotulo" data-t="p.losCinco"></span>
        <h2 class="titular entra entra--titulo" style="--d:1;margin-top:14px" data-t="p.catalogoTitle"></h2>
      </div>
    </div>
    <div class="env" style="margin-top:clamp(30px,5svh,56px)">
      <div class="carril entra entra--pieza" style="--d:2" id="carril"></div>
      <div class="acciones" style="margin-top:22px">
        <a class="btn" href="catalogo.html" data-t="p.verTodo"></a>
        <a class="btn btn--suave" href="comparar.html" data-t="p.verComparador"></a>
      </div>
    </div>
  </section>

  <!-- ============ 7 · KEYMAP STUDIO ============ -->
  <section class="escena">
    <div class="env centro" style="display:grid;gap:26px;justify-items:center">
      <div class="centro">
        <span class="rotulo entra entra--rotulo">Keymap Studio</span>
        <h2 class="titular entra entra--titulo" style="--d:1;margin-top:14px" data-t-html="studio.title"></h2>
      </div>
      <p class="bajada centro entra entra--texto" style="--d:2" data-t="p.studioText"></p>
      <div class="acciones entra entra--texto" style="--d:3">
        <a class="btn" href="keymap-studio/" data-t="studio.cta"></a>
      </div>
      <p class="rotulo entra entra--rotulo" style="--d:4" data-t="p.repos"></p>
    </div>
  </section>

  <!-- ============ 8 · CONFIANZA ============ -->
  <section class="escena escena--carta">
    <div class="env">
      <div class="cuatro" id="confianza"></div>
    </div>
  </section>
</main>

<footer class="env">
  <div class="pie">
    <p class="nota" id="nota"></p>
    <p data-t="footer.copy"></p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/tienda.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);

  /* Esquema de la placa: seis columnas por mitad. Es un dibujo, y por eso
     lleva su rotulo debajo. */
  function dibujarPlaca() {
    const mitad = () => `<div class="kb__mitad">${
      Array.from({ length: 24 }, () => `<span class="kb__tecla"></span>`).join("")}</div>`;
    $("#kbPlaca").innerHTML = mitad() + mitad();
  }

  const LEYENDAS = [
    [["Q","1"],["W","2"],["E","3"],["R","4"],["T","5"],["Y","6"]],
    [["⇧","⇧"],["A","←"],["S","↓"],["D","↑"],["F","→"],["G","⌫"]],
  ];
  function dibujarCapas() {
    $("#capasFila").innerHTML = LEYENDAS.map((fila, f) =>
      `<div class="capas__fila">${fila.map(([a, b], i) =>
        `<span class="capas__t${f === 1 && i === 0 ? " capas__t--hold" : ""}">
           <span>${a}</span><span>${b}</span>
         </span>`).join("")}</div>`).join("");
  }

  function pintar() {
    const productos = CK.productos();
    /* Los cinco estan marcados como `featured`, asi que `find` devolvia
       siempre el primero. El heroe ensena el Retro a proposito: es el
       unico con rotulo serigrafiado y el que mejor se lee en foto. */
    const destacado = productos.find(p => p.id === "sofle-retro") || productos[0];
    const est = CK.stock(destacado);

    $("#nota").textContent = CK.notaPrecios();

    const foto = $("#heroImg");
    foto.src = CK.foto(destacado);
    foto.alt = `${destacado.name} ${destacado.version || ""}`.trim();

    /* La chapa dice el nombre en tres niveles, el precio DE ENTRADA con su
       "desde" delante, y el stock. Y lleva al anuncio concreto. */
    $("#chapa").href = CK.enlaceCompra(destacado);
    $("#chapa").innerHTML = `
      <span>${CK.rotulo(destacado)}</span>
      <span class="chapa__sep" aria-hidden="true"></span>
      <span>${CK.precioHTML(destacado)}</span>
      <span class="chapa__sep" aria-hidden="true"></span>
      <em>${CK.escapar(est.txt)}</em>`;

    /* Sin `loading="lazy"`: las cinco fotos viven dentro de un carril con
       `overflow-x:auto`, y ahi el navegador considera que las cuatro que
       no se ven estan fuera de pantalla y no las carga nunca. Son cinco
       imagenes pequenas; cargarlas es mas barato que el fallo. */
    $("#carril").innerHTML = productos.map(p => {
      const e = CK.stock(p);
      return `
        <a href="modelo.html?id=${p.id}">
          <img src="${CK.foto(p, true)}" alt="${CK.escapar(p.name)}" data-foco="${p.foco ?? 50}">
          <div>
            <h3>${CK.rotulo(p)}</h3>
            <p class="precio">${CK.precioHTML(p)}</p>
            <p class="estado ${e.clase}">${CK.escapar(e.txt)}</p>
          </div>
        </a>`;
    }).join("");

    $("#confianza").innerHTML = [
      ["trust.shipping","trust.shippingText"],["trust.warranty","trust.warrantyText"],
      ["trust.custom","trust.customText"],["trust.firmware","trust.firmwareText"],
    ].map(([a,b],i)=>`<div class="entra entra--texto" style="--d:${i}"><h3>${CK.t(a)}</h3><p>${CK.t(b)}</p></div>`).join("");

    dibujarPlaca();
    dibujarCapas();
    CK.encuadrarTodo();

    /* El argumento que esta a la altura de los ojos se enciende y los
       demas se apagan. Sin escuchar el scroll: lo resuelve el observador
       con un margen que deja activa solo la banda central. */
    const ioPaso = new IntersectionObserver(es => {
      for (const e of es) e.target.classList.toggle("viva", e.isIntersecting);
    }, { rootMargin: "-42% 0px -42% 0px" });
    document.querySelectorAll(".paso").forEach(p => ioPaso.observe(p));

    CK.observarEntradas();
  }

  CK.pintarIdioma(pintar);
  pintar();
})();
</script>
</body>
</html>
