<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Codekeeb — Teclados split ergonómicos hechos a mano</title>
<meta name="description" content="Cinco teclados split ergonómicos montados y probados a mano: Sofle Choc, Totem y Corne. Elige uno y configúralo, de la placa sola al teclado listo para escribir.">
<link rel="canonical" href="https://codekeeb.github.io/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Codekeeb">
<meta property="og:title" content="Codekeeb — Teclados split ergonómicos hechos a mano">
<meta property="og:description" content="Cinco teclados split ergonómicos montados y probados a mano: Sofle Choc, Totem y Corne. Elige uno y configúralo, de la placa sola al teclado listo para escribir.">
<meta property="og:image" content="https://codekeeb.github.io/assets/img/products/sofle-retro.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Una sola familia, en su version variable: el eje de ancho (wdth) da
     la voz de titular sin cargar una segunda tipografia. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tienda.css">
</head>
<body>

<header class="top">
  <div class="top__in env">
    <a class="marca" href="/" aria-label="Codekeeb">
      <img src="assets/brand/logo-horizontal-dark.png"
           srcset="assets/brand/logo-horizontal-dark.png 1x, assets/brand/logo-horizontal-dark@2x.png 2x"
           width="640" height="224" alt="CODE/KEEB">
    </a>
    <nav class="top__nav" aria-label="Principal">
      <a href="/#tienda" aria-current="page" data-t="m.tienda">Tienda</a>
      <a class="top__comparar" href="comparar.html" data-t="d.compare">Comparar</a>
      <a href="keymap-studio/">Keymap Studio</a>
    </nav>
    <span class="top__sp"></span>
    <div class="idiomas">
      <button class="idiomas__d" data-lang-disparador aria-haspopup="true" aria-expanded="false" aria-label="Idioma">
        <span data-lang-actual>ES</span>
        <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="idiomas__m" data-lang-menu role="menu" hidden>
        <button data-lang-btn="es">Español</button>
        <button data-lang-btn="en">English</button>
        <button data-lang-btn="fr">Français</button>
      </div>
    </div>
  </div>
</header>

<main>

  <!-- ===== LA FAMILIA =====
       Lo primero que ensena ergodox: la familia de teclados en fila. Aqui
       es la portada y la tienda a la vez: lo que se vende, a la vista. -->
  <section class="familia" id="tienda" aria-labelledby="h-familia">
    <div class="env">
      <div class="familia__cab">
        <h1 class="titular" id="h-familia" data-t-html="e.familiaT"></h1>
        <p data-t="e.familiaP"></p>
        <div class="filtros" id="filtros" role="group" aria-label="Filtros"></div>
      </div>
      <div class="rejilla" id="rejilla"></div>
    </div>
  </section>

  <!-- ===== UN PRINCIPIO POR SECCION =====
       Como ergodox: el teclado dibujado con su forma real y la parte que
       se explica encendida. El dibujo es del Sofle, y el rotulo lo dice. -->
  <section class="seccion" id="split" aria-labelledby="h-split">
    <div class="env principio">
      <div class="principio__vis"><div class="dibujo" id="dSplit"></div><p class="nota" data-nota-dib="Sofle"></p></div>
      <div class="principio__txt"><h2 id="h-split" data-t="e.splitT"></h2><p data-t="e.splitP"></p></div>
    </div>
  </section>

  <section class="seccion s-niebla" id="columnas" aria-labelledby="h-col">
    <div class="env principio principio--der">
      <div class="principio__vis"><div class="dibujo" id="dCol"></div><p class="nota" data-nota-dib="Sofle"></p></div>
      <div class="principio__txt"><h2 id="h-col" data-t="e.colT"></h2><p data-t="e.colP"></p></div>
    </div>
  </section>

  <section class="seccion" id="pulgares" aria-labelledby="h-pul">
    <div class="env principio">
      <div class="principio__vis"><div class="dibujo" id="dPul"></div><p class="nota" data-nota-dib="Sofle"></p></div>
      <div class="principio__txt"><h2 id="h-pul" data-t="e.pulT"></h2><p data-t="e.pulP"></p></div>
    </div>
  </section>

  <section class="seccion s-hielo" id="capas" aria-labelledby="h-capas">
    <div class="env principio principio--der">
      <div class="principio__vis">
        <div class="capas" aria-hidden="true"><div id="capasFila"></div></div>
        <p class="nota" data-t="p.demoNota"></p>
      </div>
      <div class="principio__txt">
        <h2 id="h-capas" data-t-html="p.capasTitle"></h2>
        <p data-t="p.capasText"></p>
        <ul class="funciones">
          <li><b data-t="p.edHold"></b><span data-t="p.edHoldT"></span></li>
          <li><b data-t="p.edEnc"></b><span data-t="p.edEncT"></span></li>
          <li><b data-t="p.edMacros"></b><span data-t="p.edMacrosT"></span></li>
          <li><b data-t="p.edUnicode"></b><span data-t="p.edUnicodeT"></span></li>
        </ul>
        <p><a class="enlace" href="keymap-studio/"><span data-t="studio.cta"></span><span class="ic-flecha"></span></a></p>
      </div>
    </div>
  </section>

  <!-- La unica seccion oscura: la luz del teclado no se ve sobre blanco. -->
  <section class="seccion oscura" id="luz" aria-labelledby="h-luz">
    <div class="env principio">
      <div class="principio__vis"><div class="kb" id="kb"></div><p class="nota" data-t="p.rgbReal"></p></div>
      <div class="principio__txt">
        <h2 id="h-luz" data-t-html="p.rgbTitle"></h2>
        <p id="fxTexto"></p>
        <div class="modos" id="modos" role="group" aria-label="Modos de luz"></div>
        <p class="nota nota--izq" data-t="p.rgbOtros"></p>
      </div>
    </div>
  </section>

  <section class="seccion" id="pantallas" aria-labelledby="h-oled">
    <div class="env principio principio--der">
      <div class="principio__vis">
        <div class="oleds">
          <figure class="oled"><div class="oled__marco"><canvas id="oledIzq" width="68" height="160" aria-hidden="true"></canvas></div><figcaption data-t="p.oledIzq"></figcaption></figure>
          <figure class="oled"><div class="oled__marco"><canvas id="oledDer" width="68" height="160" aria-hidden="true"></canvas></div><figcaption data-t="p.oledDer"></figcaption></figure>
        </div>
        <p class="nota" data-t="p.oledReal"></p>
      </div>
      <div class="principio__txt"><h2 id="h-oled" data-t-html="p.oledTitle"></h2><p data-t="p.oledText"></p></div>
    </div>
  </section>

  <section class="seccion s-niebla" id="hotswap" aria-labelledby="h-hot">
    <div class="env principio">
      <div class="principio__vis">
        <div class="hot">
          <div class="hot__col">
            <svg class="hot__sw" viewBox="0 0 140 190" role="img" aria-label="Kailh Choc Red">
              <g class="hot__pieza">
                <!-- vastago: en el Choc es una placa plana con ranura -->
                <rect x="47" y="34" width="46" height="22" rx="3" fill="#b8322c"/>
                <rect x="47" y="34" width="46" height="7" rx="3" fill="#d2453e"/>
                <rect x="66" y="38" width="8" height="14" rx="2" fill="#8d231e"/>
                <!-- carcasa superior e inferior: baja y ancha -->
                <rect x="20" y="54" width="100" height="16" rx="3" fill="#2a2d33"/>
                <rect x="14" y="68" width="112" height="30" rx="4" fill="#15171b"/>
                <rect x="14" y="68" width="112" height="4" rx="2" fill="#31353c"/>
                <!-- dos patas metalicas y el poste central de plastico -->
                <rect x="38" y="97" width="6" height="17" rx="1.5" fill="#cbb26a"/>
                <rect x="96" y="97" width="6" height="17" rx="1.5" fill="#cbb26a"/>
                <rect x="64" y="97" width="12" height="12" rx="2" fill="#23262b"/>
              </g>
              <!-- zocalo hotswap sobre la placa -->
              <g class="hot__zocalo">
                <rect x="10" y="126" width="120" height="16" rx="2" fill="#191c21" stroke="#343941" stroke-width="1.5"/>
                <rect x="33" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
                <rect x="91" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
                <rect x="0" y="142" width="140" height="22" rx="2" fill="#401b47"/>
                <rect x="0" y="142" width="140" height="3" fill="#6d2e78"/>
              </g>
            </svg>
            <span class="hot__et">Kailh Choc Red</span>
            <span class="hot__dato"><span data-t="p.swLineal"></span> · low profile</span>
          </div>
          <div class="hot__col hot__col--2">
            <svg class="hot__sw" viewBox="0 0 140 190" role="img" aria-label="MMD Holy Panda">
              <g class="hot__pieza">
                <!-- vastago en cruz, que es lo que distingue un MX -->
                <rect x="63" y="14" width="14" height="34" rx="2" fill="#7a5236"/>
                <rect x="53" y="26" width="34" height="11" rx="2" fill="#7a5236"/>
                <rect x="63" y="14" width="14" height="5" rx="2" fill="#98683f"/>
                <!-- carcasa superior clara, la que le da el nombre -->
                <rect x="28" y="44" width="84" height="30" rx="4" fill="#e6e1d6"/>
                <rect x="28" y="44" width="84" height="5" rx="2" fill="#f3efe7"/>
                <rect x="36" y="40" width="68" height="6" rx="3" fill="#d8d2c4"/>
                <!-- carcasa inferior negra, mas alta que la del Choc -->
                <rect x="20" y="72" width="100" height="30" rx="4" fill="#15171b"/>
                <rect x="20" y="72" width="100" height="4" rx="2" fill="#31353c"/>
                <rect x="30" y="100" width="80" height="6" rx="2" fill="#0e1013"/>
                <rect x="44" y="105" width="6" height="16" rx="1.5" fill="#cbb26a"/>
                <rect x="90" y="105" width="6" height="16" rx="1.5" fill="#cbb26a"/>
                <circle cx="70" cy="110" r="7" fill="#23262b"/>
              </g>
              <g class="hot__zocalo">
                <rect x="10" y="126" width="120" height="16" rx="2" fill="#191c21" stroke="#343941" stroke-width="1.5"/>
                <rect x="39" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
                <rect x="85" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
                <rect x="0" y="142" width="140" height="22" rx="2" fill="#401b47"/>
                <rect x="0" y="142" width="140" height="3" fill="#6d2e78"/>
              </g>
            </svg>
            <span class="hot__et">MMD Holy Panda</span>
            <span class="hot__dato"><span data-t="p.swTactil"></span> · MX</span>
          </div>
        </div>
        <p class="nota" data-t="p.hotNota"></p>
      </div>
      <div class="principio__txt"><h2 id="h-hot" data-t-html="p.hotTitle"></h2><p data-t="p.hotText"></p></div>
    </div>
  </section>

  <section class="seccion" id="elegir" aria-labelledby="h-elegir">
    <div class="env">
      <div class="cab cab--centro"><h2 id="h-elegir" data-t-html="p2.cTitle"></h2><p data-t="p2.cLede"></p></div>
      <div class="tabla-env"><table class="tabla" id="comparativa"></table></div>
      <p class="centro-pie"><a class="enlace" href="comparar.html"><span data-t="m.verComparador"></span><span class="ic-flecha"></span></a></p>
    </div>
  </section>

  <section class="seccion s-niebla" aria-labelledby="h-conf">
    <div class="env">
      <div class="cab"><h2 id="h-conf" data-t="p2.confianza"></h2></div>
      <ul class="confianza" id="confianza"></ul>
    </div>
  </section>
</main>

<footer class="pie">
  <div class="pie__in env">
    <p id="notaPrecios"></p>
    <nav aria-label="Pie">
      <a href="/#tienda" data-t="m.tienda">Tienda</a>
      <a href="comparar.html" data-t="d.compare">Comparar</a>
      <a href="keymap-studio/">Keymap Studio</a>
    </nav>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/tienda.js"></script>
<script src="js/geometria.js"></script>
<script src="js/dibujo.js"></script>
<script src="js/sofle-led.js"></script>
<script src="js/rgb.js"></script>
<script src="js/oled-datos.js"></script>
<script src="js/oled.js"></script>
<script src="js/portada.js"></script>
</body>
</html>
