<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Codekeeb — Teclados split ergonómicos hechos a mano</title>
<meta name="description" content="Cinco teclados split ergonómicos montados y probados a mano: Sofle Choc, Totem y Corne. Elige cuánto viene montado, mira qué incluye cada opción y compáralos antes de comprar.">
<link rel="canonical" href="https://codekeeb.github.io/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://codekeeb.github.io/">
<meta property="og:site_name" content="Codekeeb">
<meta property="og:title" content="Codekeeb — Teclados split ergonómicos">
<meta property="og:description" content="Cinco teclados split ergonómicos montados y probados a mano. Precio, stock y ficha completa antes de comprar.">
<meta property="og:image" content="https://codekeeb.github.io/assets/img/products/sofle-retro.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#f4f4f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tienda.css">
</head>
<body>

<header class="top">
  <div class="top__in env">
    <a class="marca" href="/" aria-label="Codekeeb">
      <img src="assets/brand/logo-horizontal-dark.png"
           srcset="assets/brand/logo-horizontal-dark.png 1x, assets/brand/logo-horizontal-dark@2x.png 2x"
           width="640" height="224" alt="CODE/KEEB">
    </a>
    <nav class="top__nav" aria-label="Principal">
      <a href="#tienda" data-t="m.tienda">Tienda</a>
      <a class="top__comparar" href="comparar.html" data-t="d.compare">Comparar</a>
      <a class="top__studio" href="keymap-studio/">Keymap Studio</a>
    </nav>
    <span class="top__sp"></span>
    <div class="idiomas">
      <button class="idiomas__d" data-lang-disparador aria-haspopup="true" aria-expanded="false" aria-label="Idioma">
        <span data-lang-actual>ES</span>
        <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="idiomas__m" data-lang-menu role="menu" hidden>
        <button data-lang-btn="es">Español</button>
        <button data-lang-btn="en">English</button>
        <button data-lang-btn="fr">Français</button>
      </div>
    </div>
    <a class="btn" href="#tienda" data-t="d.choose">Elige tu split</a>
  </div>
</header>

<main>

  <!-- ===== HEROE: a sangre, pero no de pantalla completa =====
       Es una tienda: lo que se vende tiene que asomar en la primera
       pantalla. El recorte sale del `foco` medido de la foto. -->
  <section class="heroe">
    <img class="heroe__foto" src="assets/img/products/sofle-retro.jpg" alt="Sofle Choc Retro"
         width="1200" height="838" fetchpriority="high" data-foco="63" data-encaje="58">
    <div class="heroe__texto env">
      <h1 data-t-html="p.heroTitle"></h1>
      <p data-t="p.heroText"></p>
      <div class="acciones">
        <a class="btn btn--claro" href="#tienda" data-t="p.heroCta"></a>
        <a class="btn btn--cristal" href="comparar.html" data-t="p.heroCta2"></a>
      </div>
    </div>
  </section>

  <!-- ===== LA TIENDA ===== -->
  <section class="seccion" id="tienda" aria-labelledby="h-tienda">
    <div class="env">
      <div class="seccion__cab seccion__cab--fila">
        <div class="seccion__txt">
          <h2 class="titulo" id="h-tienda" data-t="d.choose"></h2>
          <p class="entradilla" data-t="d.lede"></p>
        </div>
        <div class="filtros" id="filtros" role="group" aria-label="Filtros"></div>
      </div>
      <div class="rejilla" id="rejilla"></div>
    </div>
  </section>

  <!-- ===== LO QUE LLEVA, FUNCIONANDO =====
       Antes eran cuatro regiones de pantalla completa seguidas. Ahora es
       un escenario con pestanas: lo mismo en una pantalla, y el que quiera
       verlo todo pulsa. -->
  <section class="seccion oscuro" id="ventajas" aria-labelledby="h-ventajas">
    <div class="env">
      <div class="seccion__cab">
        <h2 class="titulo" id="h-ventajas" data-t-html="p2.vTitle"></h2>
        <p class="entradilla" data-t="p2.vLede"></p>
      </div>

      <div class="pestanas" role="tablist" aria-label="Ventajas">
        <button role="tab" id="t-rgb" aria-controls="v-rgb" aria-selected="true" data-t="p2.tRgb"></button>
        <button role="tab" id="t-oled" aria-controls="v-oled" aria-selected="false" tabindex="-1" data-t="p2.tOled"></button>
        <button role="tab" id="t-capas" aria-controls="v-capas" aria-selected="false" tabindex="-1" data-t="p2.tCapas"></button>
        <button role="tab" id="t-hot" aria-controls="v-hot" aria-selected="false" tabindex="-1" data-t="p2.tHot"></button>
      </div>

      <div class="escenario">
        <div class="panel" id="v-rgb" role="tabpanel" aria-labelledby="t-rgb" aria-hidden="false">
          <div class="escenario__lienzo">
            <div class="kb" id="kb"></div>
            <p class="nota" data-t="p.rgbReal"></p>
          </div>
          <div class="escenario__texto">
            <h3 data-t-html="p.rgbTitle"></h3>
            <p id="fxTexto"></p>
            <div class="modos" id="modos" role="group" aria-label="Modos de luz"></div>
            <p class="nota nota--izq" data-t="p.rgbOtros"></p>
          </div>
        </div>

        <div class="panel" id="v-oled" role="tabpanel" aria-labelledby="t-oled" aria-hidden="true" hidden>
          <div class="escenario__lienzo">
            <div class="oleds">
              <figure class="oled">
                <div class="oled__marco"><canvas id="oledIzq" width="68" height="160" aria-hidden="true"></canvas></div>
                <figcaption data-t="p.oledIzq"></figcaption>
              </figure>
              <figure class="oled">
                <div class="oled__marco"><canvas id="oledDer" width="68" height="160" aria-hidden="true"></canvas></div>
                <figcaption data-t="p.oledDer"></figcaption>
              </figure>
            </div>
            <p class="nota" data-t="p.oledReal"></p>
          </div>
          <div class="escenario__texto">
            <h3 data-t-html="p.oledTitle"></h3>
            <p data-t="p.oledText"></p>
          </div>
        </div>

        <div class="panel" id="v-capas" role="tabpanel" aria-labelledby="t-capas" aria-hidden="true" hidden>
          <div class="escenario__lienzo">
            <div class="capas" aria-hidden="true"><div id="capasFila"></div></div>
            <p class="nota" data-t="p.demoNota"></p>
          </div>
          <div class="escenario__texto">
            <h3 data-t-html="p.capasTitle"></h3>
            <p data-t="p.capasText"></p>
            <ul class="funciones">
              <li><b data-t="p.edHold"></b><span data-t="p.edHoldT"></span></li>
              <li><b data-t="p.edEnc"></b><span data-t="p.edEncT"></span></li>
              <li><b data-t="p.edMacros"></b><span data-t="p.edMacrosT"></span></li>
              <li><b data-t="p.edUnicode"></b><span data-t="p.edUnicodeT"></span></li>
            </ul>
            <a class="btn btn--claro" href="keymap-studio/" data-t="studio.cta"></a>
          </div>
        </div>

        <div class="panel" id="v-hot" role="tabpanel" aria-labelledby="t-hot" aria-hidden="true" hidden>
          <div class="escenario__lienzo">
            <div class="hot">
          <div class="hot__col">
            <svg class="hot__sw" viewBox="0 0 140 190" role="img" aria-label="Kailh Choc Red">
              <g class="hot__pieza">
                <!-- vastago: en el Choc es una placa plana con ranura -->
                <rect x="47" y="34" width="46" height="22" rx="3" fill="#b8322c"/>
                <rect x="47" y="34" width="46" height="7" rx="3" fill="#d2453e"/>
                <rect x="66" y="38" width="8" height="14" rx="2" fill="#8d231e"/>
                <!-- carcasa superior e inferior: baja y ancha -->
                <rect x="20" y="54" width="100" height="16" rx="3" fill="#2a2d33"/>
                <rect x="14" y="68" width="112" height="30" rx="4" fill="#15171b"/>
                <rect x="14" y="68" width="112" height="4" rx="2" fill="#31353c"/>
                <!-- dos patas metalicas y el poste central de plastico -->
                <rect x="38" y="97" width="6" height="17" rx="1.5" fill="#cbb26a"/>
                <rect x="96" y="97" width="6" height="17" rx="1.5" fill="#cbb26a"/>
                <rect x="64" y="97" width="12" height="12" rx="2" fill="#23262b"/>
              </g>
              <!-- zocalo hotswap sobre la placa -->
              <g class="hot__zocalo">
                <rect x="10" y="126" width="120" height="16" rx="2" fill="#191c21" stroke="#343941" stroke-width="1.5"/>
                <rect x="33" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
                <rect x="91" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
                <rect x="0" y="142" width="140" height="22" rx="2" fill="#401b47"/>
                <rect x="0" y="142" width="140" height="3" fill="#6d2e78"/>
              </g>
            </svg>
            <span class="hot__et">Kailh Choc Red</span>
            <span class="hot__dato"><span data-t="p.swLineal"></span> · low profile</span>
          </div>
          <div class="hot__col hot__col--2">
            <svg class="hot__sw" viewBox="0 0 140 190" role="img" aria-label="MMD Holy Panda">
              <g class="hot__pieza">
                <!-- vastago en cruz, que es lo que distingue un MX -->
                <rect x="63" y="14" width="14" height="34" rx="2" fill="#7a5236"/>
                <rect x="53" y="26" width="34" height="11" rx="2" fill="#7a5236"/>
                <rect x="63" y="14" width="14" height="5" rx="2" fill="#98683f"/>
                <!-- carcasa superior clara, la que le da el nombre -->
                <rect x="28" y="44" width="84" height="30" rx="4" fill="#e6e1d6"/>
                <rect x="28" y="44" width="84" height="5" rx="2" fill="#f3efe7"/>
                <rect x="36" y="40" width="68" height="6" rx="3" fill="#d8d2c4"/>
                <!-- carcasa inferior negra, mas alta que la del Choc -->
                <rect x="20" y="72" width="100" height="30" rx="4" fill="#15171b"/>
                <rect x="20" y="72" width="100" height="4" rx="2" fill="#31353c"/>
                <rect x="30" y="100" width="80" height="6" rx="2" fill="#0e1013"/>
                <rect x="44" y="105" width="6" height="16" rx="1.5" fill="#cbb26a"/>
                <rect x="90" y="105" width="6" height="16" rx="1.5" fill="#cbb26a"/>
                <circle cx="70" cy="110" r="7" fill="#23262b"/>
              </g>
              <g class="hot__zocalo">
                <rect x="10" y="126" width="120" height="16" rx="2" fill="#191c21" stroke="#343941" stroke-width="1.5"/>
                <rect x="39" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
                <rect x="85" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
                <rect x="0" y="142" width="140" height="22" rx="2" fill="#401b47"/>
                <rect x="0" y="142" width="140" height="3" fill="#6d2e78"/>
              </g>
            </svg>
            <span class="hot__et">MMD Holy Panda</span>
            <span class="hot__dato"><span data-t="p.swTactil"></span> · MX</span>
          </div>
        </div>
            <p class="nota" data-t="p.hotNota"></p>
          </div>
          <div class="escenario__texto">
            <h3 data-t-html="p.hotTitle"></h3>
            <p data-t="p.hotText"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== LOS CINCO, LADO A LADO ===== -->
  <section class="seccion seccion--carta" id="comparar" aria-labelledby="h-comparar">
    <div class="env">
      <div class="seccion__cab">
        <h2 class="titulo" id="h-comparar" data-t-html="p2.cTitle"></h2>
        <p class="entradilla" data-t="p2.cLede"></p>
      </div>
      <div class="tabla-env"><table class="tabla" id="comparativa"></table></div>
      <p class="enlace-pie"><a class="enlace" href="comparar.html" data-t="m.verComparador"></a></p>
    </div>
  </section>

  <!-- ===== ANTES DE PAGAR ===== -->
  <section class="seccion" aria-labelledby="h-confianza">
    <div class="env">
      <div class="seccion__cab"><h2 class="titulo" id="h-confianza" data-t="p2.confianza"></h2></div>
      <ul class="confianza" id="confianza"></ul>
    </div>
  </section>
</main>

<footer class="pie">
  <div class="pie__in env">
    <p id="notaPrecios"></p>
    <nav aria-label="Pie">
      <a href="#tienda" data-t="m.tienda">Tienda</a>
      <a class="top__comparar" href="comparar.html" data-t="d.compare">Comparar</a>
      <a href="keymap-studio/">Keymap Studio</a>
    </nav>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/tienda.js"></script>
<script src="js/sofle.js"></script>
<script src="js/sofle-led.js"></script>
<script src="js/rgb.js"></script>
<script src="js/oled-datos.js"></script>
<script src="js/oled.js"></script>
<script src="js/portada.js"></script>
</body>
</html>
