<main id="contenido">
  <!-- El muestrario: los cinco a la vista, cada uno en su franja de color.
       Los filtros no quitan modelos: pliegan los que no encajan. -->
  <section id="tienda" aria-labelledby="h-tienda">
    <div class="p-mando">
      <h1 class="p-titulo" id="h-tienda" data-t-html="e.familiaT"></h1>
      <div class="p-filtros" id="filtros" role="group" data-t-aria="p3.filtros"></div>
      <output class="f-pantalla p-cuenta" id="cuenta" aria-live="polite"></output>
      <p class="p-vacio" id="vacio" hidden data-t="d.nomatch"></p>
    </div>
    <div class="p-franjas" id="franjas"></div>
  </section>

  <!-- La forma: cuatro principios en un solo aparato, una tecla cada uno. -->
  <section class="f-seccion" id="forma" aria-labelledby="h-forma">
    <div class="f-in">
      <h2 class="f-h2" id="h-forma" data-t="p3.formaT"></h2>
      <p class="f-lede" data-t="p3.formaP"></p>
      <div class="p-maquina">
        <div class="p-maquina__vista">
          <div class="dibujo" id="dibujo"></div>
          <!-- Vista de lado, a escala (5 unidades por mm): la PCB, el zocalo
               DEBAJO de ella, y el switch que sale recto con sus patas. Al
               salir se ven los taladros vacios y el zocalo se enciende: no
               hay soldadura. -->
          <div class="hot" id="hot" hidden>
            <figure class="hot__col">
              <svg class="hot__sw" viewBox="0 44 150 120" role="img" aria-label="Kailh Choc Red">
                <g class="hot__placa">
                  <rect class="hot__pcb" x="5" y="140" width="140" height="8" rx="1.5"/>
                  <rect class="hot__hueco" x="57" y="140" width="6" height="8"/>
                  <rect class="hot__hueco" x="70" y="140" width="10" height="8"/>
                  <rect class="hot__hueco" x="91" y="140" width="6" height="8"/>
                  <rect class="hot__zocalo" x="42" y="148" width="26" height="10" rx="2"/>
                  <rect class="hot__zocalo" x="82" y="148" width="26" height="10" rx="2"/>
                  <rect class="hot__contacto" x="56" y="148" width="8" height="6" rx="1"/>
                  <rect class="hot__contacto" x="90" y="148" width="8" height="6" rx="1"/>
                </g>
                <g class="hot__pieza">
                  <rect class="hot__pata" x="58" y="138" width="4" height="17" rx="1"/>
                  <rect class="hot__pata" x="92" y="138" width="4" height="17" rx="1"/>
                  <rect class="hot__poste" x="71" y="138" width="8" height="13" rx="2"/>
                  <rect class="hot__base" x="37.5" y="126" width="75" height="14" rx="3"/>
                  <rect class="hot__tapa" x="41" y="119" width="68" height="8" rx="3"/>
                  <rect fill="#d8453b" x="51" y="109" width="48" height="11" rx="2.5"/>
                  <rect fill="#ec6a60" x="51" y="109" width="48" height="3.5" rx="1.75"/>
                </g>
              </svg>
              <figcaption><span class="hot__et">Kailh Choc Red</span>
                <span class="hot__dato"><span data-t="p.swLineal"></span> · low profile</span></figcaption>
            </figure>
            <figure class="hot__col hot__col--2">
              <svg class="hot__sw" viewBox="0 44 150 120" role="img" aria-label="MMD Holy Panda">
                <g class="hot__placa">
                  <rect class="hot__pcb" x="5" y="140" width="140" height="8" rx="1.5"/>
                  <rect class="hot__hueco" x="55" y="140" width="6" height="8"/>
                  <rect class="hot__hueco" x="64" y="140" width="22" height="8"/>
                  <rect class="hot__hueco" x="89" y="140" width="6" height="8"/>
                  <rect class="hot__zocalo" x="40" y="148" width="24" height="10" rx="2"/>
                  <rect class="hot__zocalo" x="86" y="148" width="24" height="10" rx="2"/>
                  <rect class="hot__contacto" x="54" y="148" width="8" height="6" rx="1"/>
                  <rect class="hot__contacto" x="88" y="148" width="8" height="6" rx="1"/>
                </g>
                <g class="hot__pieza">
                  <rect class="hot__pata" x="56" y="138" width="4" height="17" rx="1"/>
                  <rect class="hot__pata" x="90" y="138" width="4" height="17" rx="1"/>
                  <rect class="hot__poste" x="65" y="138" width="20" height="16" rx="3"/>
                  <rect class="hot__base" x="40" y="121" width="70" height="19" rx="3"/>
                  <path fill="#e9e4d8" d="M36 122 L45 103 H105 L114 122 Z"/>
                  <path fill="#f6f2ea" d="M43.5 106 L45 103 H105 L106.5 106 Z"/>
                  <rect fill="#7a5236" x="66" y="85" width="18" height="19" rx="2"/>
                  <rect fill="#98683f" x="66" y="85" width="18" height="4" rx="2"/>
                </g>
              </svg>
              <figcaption><span class="hot__et">MMD Holy Panda</span>
                <span class="hot__dato"><span data-t="p.swTactil"></span> · MX</span></figcaption>
            </figure>
            <ul class="hot__leyenda">
              <li><i class="hot__muestra hot__muestra--pcb"></i><span data-t="p3.pcb"></span></li>
              <li><i class="hot__muestra hot__muestra--zocalo"></i><span data-t="p3.zocalo"></span></li>
              <li><i class="hot__muestra hot__muestra--libre"></i><span data-t="p3.libre"></span></li>
            </ul>
          </div>
        </div>
        <div class="p-maquina__mandos">
          <div class="p-modos" id="formas" role="group" data-t-aria="p3.modosForma"></div>
          <h3 id="formaT" aria-live="polite"></h3>
          <p id="formaP"></p>
          <p class="f-nota" id="formaNota"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Lo que hace el firmware, en pantallas de verdad. -->
  <section class="f-seccion" id="firmware" aria-labelledby="h-firmware">
    <div class="f-in">
      <h2 class="f-h2" id="h-firmware" data-t="p3.firmwareT"></h2>
      <div class="f-aparatos">
        <article class="f-aparato f-aparato--luz" id="luz">
          <h3 data-t-html="p.rgbTitle"></h3>
          <div class="f-aparato__pantalla"><div class="kb" id="kb"></div></div>
          <div class="modos" id="modos" role="group" data-t-aria="p3.modosLuz"></div>
          <p id="fxTexto"></p>
          <p class="f-nota"><span data-t="p.rgbReal"></span> <span data-t="p.rgbOtros"></span></p>
        </article>
        <article class="f-aparato">
          <h3 data-t-html="p.oledTitle"></h3>
          <div class="oleds">
            <figure class="oled"><div class="oled__marco"><canvas id="oledIzq" width="68" height="160" aria-hidden="true"></canvas></div><figcaption data-t="p.oledIzq"></figcaption></figure>
            <figure class="oled"><div class="oled__marco"><canvas id="oledDer" width="68" height="160" aria-hidden="true"></canvas></div><figcaption data-t="p.oledDer"></figcaption></figure>
          </div>
          <p data-t="p.oledText"></p>
          <p class="f-nota" data-t="p.oledReal"></p>
        </article>
        <article class="f-aparato" id="p-capas">
          <h3 data-t-html="p.capasTitle"></h3>
          <div class="capas" aria-hidden="true"><div id="capasFila"></div></div>
          <p data-t="p.capasText"></p>
          <ul class="funciones">
            <li><b data-t="p.edHold"></b><span data-t="p.edHoldT"></span></li>
            <li><b data-t="p.edEnc"></b><span data-t="p.edEncT"></span></li>
            <li><b data-t="p.edMacros"></b><span data-t="p.edMacrosT"></span></li>
            <li><b data-t="p.edUnicode"></b><span data-t="p.edUnicodeT"></span></li>
          </ul>
          <p class="f-nota" data-t="p.demoNota"></p>
          <a class="f-tecla f-tecla--tinta" href="keymap-studio/" data-t="studio.cta"></a>
        </article>
      </div>
    </div>
  </section>

  <section class="f-seccion" id="elegir" aria-labelledby="h-elegir">
    <div class="f-in">
      <h2 class="f-h2" id="h-elegir" data-t-html="p2.cTitle"></h2>
      <p class="f-lede" data-t="p2.cLede"></p>
      <div class="tabla-env" tabindex="0" role="region" aria-labelledby="h-elegir"><table class="tabla" id="comparativa"></table></div>
      <p><a class="f-enlace" href="comparar.html"><span data-t="m.verComparador"></span><span class="ic-flecha"></span></a></p>
    </div>
  </section>

  <section class="f-seccion f-seccion--gris" aria-labelledby="h-conf">
    <div class="f-in">
      <h2 class="f-h2" id="h-conf" data-t="p2.confianza"></h2>
      <ul class="confianza" id="confianza"></ul>
    </div>
  </section>
</main>
