  <a class="f-marca" href="/" aria-label="Codekeeb">
    <img src="assets/brand/logo-horizontal-dark.png"
         srcset="assets/brand/logo-horizontal-dark.png 1x, assets/brand/logo-horizontal-dark@2x.png 2x"
         width="640" height="224" alt="CODE/KEEB">

  <nav class="p-nav" aria-label="Principal">
    <a href="/#tienda" aria-current="page" data-t="m.tienda">Tienda</a>
    <a href="comparar.html" data-t="d.compare">Comparar</a>
    <a class="p-nav__studio" href="keymap-studio/">Keymap Studio</a>
  </nav>
  <div class="f-ajustes">
    <button type="button" class="f-pausa" data-pausa hidden></button>
    <div class="idiomas">
      <button class="idiomas__d" data-lang-disparador aria-haspopup="true" aria-expanded="false" aria-label="Idioma">
        <span data-lang-actual>ES</span>
        <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="idiomas__m" data-lang-menu role="menu" hidden>
        <button data-lang-btn="es">Español</button>
        <button data-lang-btn="en">English</button>
        <button data-lang-btn="fr">Français</button>
      </div>
    </div>
  </div>

<main id="contenido">
  <!-- El muestrario: los cinco a la vista, cada uno en su franja de color.
       Los filtros no quitan modelos: pliegan los que no encajan. -->
  <section id="tienda" aria-labelledby="h-tienda">
    <div class="p-mando">
      <h1 class="p-titulo" id="h-tienda" data-t-html="e.familiaT"></h1>
      <div class="p-filtros" id="filtros" role="group" data-t-aria="p3.filtros"></div>
      <output class="f-pantalla p-cuenta" id="cuenta" aria-live="polite"></output>
      <p class="p-vacio" id="vacio" hidden data-t="d.nomatch"></p>
    </div>
    <div class="p-franjas" id="franjas"></div>
  </section>

  <!-- La forma: cuatro principios en un solo aparato, una tecla cada uno. -->
  <section class="f-seccion" id="forma" aria-labelledby="h-forma">
    <div class="f-in">
      <h2 class="f-h2" id="h-forma" data-t="p3.formaT"></h2>
      <p class="f-lede" data-t="p3.formaP"></p>
      <div class="p-maquina">
        <div class="p-maquina__vista">
          <div class="dibujo" id="dibujo"></div>
          <div class="hot" id="hot" hidden>
      <div class="hot__col">
        <svg class="hot__sw" viewBox="0 0 140 190" role="img" aria-label="Kailh Choc Red">
          <g class="hot__pieza">
            <!-- vastago: en el Choc es una placa plana con ranura -->
            <rect x="47" y="34" width="46" height="22" rx="3" fill="#b8322c"/>
            <rect x="47" y="34" width="46" height="7" rx="3" fill="#d2453e"/>
            <rect x="66" y="38" width="8" height="14" rx="2" fill="#8d231e"/>
            <!-- carcasa superior e inferior: baja y ancha -->
            <rect x="20" y="54" width="100" height="16" rx="3" fill="#2a2d33"/>
            <rect x="14" y="68" width="112" height="30" rx="4" fill="#15171b"/>
            <rect x="14" y="68" width="112" height="4" rx="2" fill="#31353c"/>
            <!-- dos patas metalicas y el poste central de plastico -->
            <rect x="38" y="97" width="6" height="17" rx="1.5" fill="#cbb26a"/>
            <rect x="96" y="97" width="6" height="17" rx="1.5" fill="#cbb26a"/>
            <rect x="64" y="97" width="12" height="12" rx="2" fill="#23262b"/>
          </g>
          <!-- zocalo hotswap sobre la placa -->
          <g class="hot__zocalo">
            <rect x="10" y="126" width="120" height="16" rx="2" fill="#191c21" stroke="#343941" stroke-width="1.5"/>
            <rect x="33" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
            <rect x="91" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
            <rect x="0" y="142" width="140" height="22" rx="2" fill="#401b47"/>
            <rect x="0" y="142" width="140" height="3" fill="#6d2e78"/>
          </g>
        </svg>
        <span class="hot__et">Kailh Choc Red</span>
        <span class="hot__dato"><span data-t="p.swLineal"></span> · low profile</span>
      </div>
      <div class="hot__col hot__col--2">
        <svg class="hot__sw" viewBox="0 0 140 190" role="img" aria-label="MMD Holy Panda">
          <g class="hot__pieza">
            <!-- vastago en cruz, que es lo que distingue un MX -->
            <rect x="63" y="14" width="14" height="34" rx="2" fill="#7a5236"/>
            <rect x="53" y="26" width="34" height="11" rx="2" fill="#7a5236"/>
            <rect x="63" y="14" width="14" height="5" rx="2" fill="#98683f"/>
            <!-- carcasa superior clara, la que le da el nombre -->
            <rect x="28" y="44" width="84" height="30" rx="4" fill="#e6e1d6"/>
            <rect x="28" y="44" width="84" height="5" rx="2" fill="#f3efe7"/>
            <rect x="36" y="40" width="68" height="6" rx="3" fill="#d8d2c4"/>
            <!-- carcasa inferior negra, mas alta que la del Choc -->
            <rect x="20" y="72" width="100" height="30" rx="4" fill="#15171b"/>
            <rect x="20" y="72" width="100" height="4" rx="2" fill="#31353c"/>
            <rect x="30" y="100" width="80" height="6" rx="2" fill="#0e1013"/>
            <rect x="44" y="105" width="6" height="16" rx="1.5" fill="#cbb26a"/>
            <rect x="90" y="105" width="6" height="16" rx="1.5" fill="#cbb26a"/>
            <circle cx="70" cy="110" r="7" fill="#23262b"/>
          </g>
          <g class="hot__zocalo">
            <rect x="10" y="126" width="120" height="16" rx="2" fill="#191c21" stroke="#343941" stroke-width="1.5"/>
            <rect x="39" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
            <rect x="85" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
            <rect x="0" y="142" width="140" height="22" rx="2" fill="#401b47"/>
            <rect x="0" y="142" width="140" height="3" fill="#6d2e78"/>
          </g>
        </svg>
        <span class="hot__et">MMD Holy Panda</span>
        <span class="hot__dato"><span data-t="p.swTactil"></span> · MX</span>
      </div>
    </div>
        </div>
        <div class="p-maquina__mandos">
          <div class="p-modos" id="formas" role="group" data-t-aria="p3.modosForma"></div>
          <h3 id="formaT" aria-live="polite"></h3>
          <p id="formaP"></p>
          <p class="f-nota" id="formaNota"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Lo que hace el firmware, en pantallas de verdad. -->
  <section class="f-seccion" id="firmware" aria-labelledby="h-firmware">
    <div class="f-in">
      <h2 class="f-h2" id="h-firmware" data-t="p3.firmwareT"></h2>
      <div class="f-aparatos">
        <article class="f-aparato f-aparato--luz" id="luz">
          <h3 data-t-html="p.rgbTitle"></h3>
          <div class="f-aparato__pantalla"><div class="kb" id="kb"></div></div>
          <div class="modos" id="modos" role="group" data-t-aria="p3.modosLuz"></div>
          <p id="fxTexto"></p>
          <p class="f-nota"><span data-t="p.rgbReal"></span> <span data-t="p.rgbOtros"></span></p>
        </article>
        <article class="f-aparato">
          <h3 data-t-html="p.oledTitle"></h3>
          <div class="oleds">
            <figure class="oled"><div class="oled__marco"><canvas id="oledIzq" width="68" height="160" aria-hidden="true"></canvas></div><figcaption data-t="p.oledIzq"></figcaption></figure>
            <figure class="oled"><div class="oled__marco"><canvas id="oledDer" width="68" height="160" aria-hidden="true"></canvas></div><figcaption data-t="p.oledDer"></figcaption></figure>
          </div>
          <p data-t="p.oledText"></p>
          <p class="f-nota" data-t="p.oledReal"></p>
        </article>
        <article class="f-aparato" id="p-capas">
          <h3 data-t-html="p.capasTitle"></h3>
          <div class="capas" aria-hidden="true"><div id="capasFila"></div></div>
          <p data-t="p.capasText"></p>
          <ul class="funciones">
            <li><b data-t="p.edHold"></b><span data-t="p.edHoldT"></span></li>
            <li><b data-t="p.edEnc"></b><span data-t="p.edEncT"></span></li>
            <li><b data-t="p.edMacros"></b><span data-t="p.edMacrosT"></span></li>
            <li><b data-t="p.edUnicode"></b><span data-t="p.edUnicodeT"></span></li>
          </ul>
          <p class="f-nota" data-t="p.demoNota"></p>
          <a class="f-tecla f-tecla--tinta" href="keymap-studio/" data-t="studio.cta"></a>
        </article>
      </div>
    </div>
  </section>

  <section class="f-seccion" id="elegir" aria-labelledby="h-elegir">
    <div class="f-in">
      <h2 class="f-h2" id="h-elegir" data-t-html="p2.cTitle"></h2>
      <p class="f-lede" data-t="p2.cLede"></p>
      <div class="tabla-env" tabindex="0" role="region" aria-labelledby="h-elegir"><table class="tabla" id="comparativa"></table></div>
      <p><a class="f-enlace" href="comparar.html"><span data-t="m.verComparador"></span><span class="ic-flecha"></span></a></p>
    </div>
  </section>

  <section class="f-seccion f-seccion--gris" aria-labelledby="h-conf">
    <div class="f-in">
      <h2 class="f-h2" id="h-conf" data-t="p2.confianza"></h2>
      <ul class="confianza" id="confianza"></ul>
    </div>
  </section>
</main>

  <div class="f-in f-pie__in">

  </div>
