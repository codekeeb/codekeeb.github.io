<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codekeeb — Teclados split ergonómicos hechos a mano</title>
<meta name="description" content="Cinco teclados split ergonómicos montados y probados a mano: Sofle Choc, Totem y Corne. Presoldados, hotswap, firmware abierto y un editor propio para reprogramarlos sin instalar nada.">
<link rel="canonical" href="https://codekeeb.github.io/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://codekeeb.github.io/">
<meta property="og:site_name" content="Codekeeb">
<meta property="og:title" content="Codekeeb — Teclados split ergonómicos">
<meta property="og:description" content="Cinco teclados split ergonómicos montados y probados a mano: Sofle Choc, Totem y Corne. Presoldados, hotswap, firmware abierto y un editor propio para reprogramarlos sin instalar nada.">
<meta property="og:image" content="https://codekeeb.github.io/assets/img/products/sofle-retro.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Codekeeb — Teclados split ergonómicos">
<meta name="twitter:description" content="Cinco teclados split ergonómicos montados y probados a mano: Sofle Choc, Totem y Corne. Presoldados, hotswap, firmware abierto y un editor propio para reprogramarlos sin instalar nada.">
<meta name="twitter:image" content="https://codekeeb.github.io/assets/img/products/sofle-retro.jpg">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<meta name="theme-color" content="#f2f2ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Martian+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portada.css">
</head>
<body>

<header class="top">
  <div class="top__in env">
    <a class="marca" href="/" aria-label="Codekeeb">
      <img src="assets/brand/logo-horizontal-dark.png"
           srcset="assets/brand/logo-horizontal-dark.png 1x, assets/brand/logo-horizontal-dark@2x.png 2x"
           width="640" height="224" alt="CODE/KEEB">
    </a>
    <nav class="top__nav">
      <a href="#rgb" data-t="p.navVentajas">Ventajas</a>
      <a href="#cinco" data-t="p.losCinco">Los cinco</a>
      <a href="comparar.html" data-t="d.compare">Comparar</a>
      <a class="top__studio" href="keymap-studio/">Keymap Studio</a>
    </nav>
    <span class="top__sp"></span>
    <div class="idiomas">
      <button class="idiomas__d" data-lang-disparador aria-haspopup="true" aria-expanded="false"
              aria-label="Idioma"><span data-lang-actual>ES</span><svg viewBox="0 0 10 6" aria-hidden="true"
              width="10" height="6"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="idiomas__m" data-lang-menu role="menu" hidden>
        <button data-lang-btn="es">Español</button>
        <button data-lang-btn="en">English</button>
        <button data-lang-btn="fr">Français</button>
      </div>
    </div>
    <a class="btn" href="catalogo.html" data-t="d.choose">Elige tu split</a>
  </div>
</header>

<main>

  <!-- ============ 1 · HERO ============
       A sangre: la foto toca los cuatro bordes de la ventana y el texto va
       encima, dentro de la columna de la pagina. Es un cambio de criterio
       respecto a "ninguna imagen a sangre", pedido el 15 sep.

       El recorte lo sigue calculando `CK.encuadrarTodo()` con el `foco`
       medido de la foto (63%); ver el comentario del heroe en portada.css. -->
  <section class="hero">
    <!-- El `src` va en el HTML y no lo pone el script: sin el, la pagina
           sale con una imagen rota hasta que cargan tres archivos de JS, y
           ademas el navegador no puede empezar a bajarla hasta entonces.
           El modelo del heroe esta fijado (el Retro), asi que no es un dato
           que cambie solo. -->
      <img class="hero__foto" id="heroImg" fetchpriority="high"
           src="assets/img/products/sofle-retro.jpg" alt="Sofle Choc Retro"
           data-foco="63" data-encaje="62">
    <div class="hero__velo" aria-hidden="true"></div>
    <div class="hero__texto env">
      <h1 class="titular entra entra--titulo" data-t-html="p.heroTitle"></h1>
      <p class="bajada entra entra--texto" style="--d:1" data-t="p.heroText"></p>
      <div class="acciones entra entra--texto" style="--d:2">
        <a class="btn" href="catalogo.html" data-t="p.heroCta"></a>
        <a class="btn btn--claro" href="comparar.html" data-t="p.heroCta2"></a>
      </div>
    </div>
    <a class="chapa" id="chapa" target="_blank" rel="noopener"></a>
  </section>

  <!-- ============ 2 · LOS MODOS DE LUZ ============
       El teclado se queda fijo y los modos pasan a su lado. No es un
       dibujo: `js/sofle.js` trae la geometria del shield y `js/rgb.js`
       los cinco efectos con los colores y las velocidades del firmware.
       Los otros cinco se nombran abajo sin animarse. -->
  <section class="fijada" id="rgb">
    <div class="fijada__in env">
      <div class="fijada__lienzo">
        <div class="esquema">
          <div class="kb" id="kb"></div>
          <p class="esquema__nota" data-t="p.rgbReal"></p>
        </div>
      </div>
      <div class="fijada__pasos">
        <div class="paso paso--titular" data-fx=""><p data-t-html="p.rgbTitle"></p></div>
        <div class="paso" data-fx="gradient">
          <b class="paso__n">gradient</b><p data-t="p.fx1Text"></p></div>
        <div class="paso" data-fx="ripple">
          <b class="paso__n">ripple</b><p data-t="p.fx2Text"></p></div>
        <div class="paso" data-fx="fire">
          <b class="paso__n">fire</b><p data-t="p.fx3Text"></p></div>
        <div class="paso" data-fx="sunset">
          <b class="paso__n">sunset</b><p data-t="p.fx4Text"></p></div>
        <div class="paso" data-fx="heatmap">
          <b class="paso__n">heatmap</b><p data-t="p.fx5Text"></p></div>
        <div class="paso paso--cola"><p class="rotulo" data-t="p.rgbOtros"></p></div>
      </div>
    </div>
  </section>

  <!-- ============ 3 · LAS DOS OLED ============
       Dos pantallas separadas, no una caja con textos: es lo que lleva el
       teclado y cada una hace una cosa distinta. Los mapas de bits son los
       del firmware (`js/oled-datos.js`) y la composicion es la misma que
       usa el editor (`js/oled.js`). -->
  <section class="escena escena--noche">
    <div class="env centro pila">
      <div class="centro">
        <span class="rotulo entra entra--rotulo" data-t="p.oledLabel"></span>
        <h2 class="titular entra entra--titulo" style="--d:1;margin-top:14px" data-t-html="p.oledTitle"></h2>
      </div>
      <div class="esquema entra entra--pieza" style="--d:2">
        <div class="oleds">
          <figure class="oled">
            <div class="oled__marco"><canvas id="oledIzq" width="68" height="160" aria-hidden="true"></canvas></div>
            <figcaption data-t="p.oledIzq"></figcaption>
          </figure>
          <figure class="oled">
            <div class="oled__marco"><canvas id="oledDer" width="68" height="160" aria-hidden="true"></canvas></div>
            <figcaption data-t="p.oledDer"></figcaption>
          </figure>
        </div>
        <p class="esquema__nota" data-t="p.oledReal"></p>
      </div>
      <p class="bajada centro entra entra--texto" style="--d:3" data-t="p.oledText"></p>
    </div>
  </section>

  <!-- ============ 4 · CAPAS Y EL EDITOR ============
       La demo de capas se queda (ensena que las teclas cambian de
       significado), y debajo va lo que el editor hace de verdad, sacado
       de sus propias funciones: hold-tap, encoders por capa, macros
       guardadas en el teclado, unicode y la lista de behaviors que el
       firmware declara por USB. -->
  <section class="escena escena--noche">
    <div class="env centro pila">
      <div class="centro">
        <span class="rotulo entra entra--rotulo" data-t="p.capasLabel"></span>
        <h2 class="titular entra entra--titulo" style="--d:1;margin-top:14px" data-t-html="p.capasTitle"></h2>
      </div>
      <div class="esquema entra entra--pieza" style="--d:2">
        <div class="capas">
          <div id="capasFila" aria-hidden="true"></div>
          <p class="capas__pie" aria-hidden="true">
            <span data-t="p.capasLabel"></span><b><span>1</span><span>2</span></b>
          </p>
        </div>
        <p class="esquema__nota" data-t="p.demoNota"></p>
      </div>
      <p class="bajada centro entra entra--texto" style="--d:3" data-t="p.capasText"></p>

      <ul class="editor entra entra--texto" style="--d:4">
        <li><h3 data-t="p.edCapas"></h3><p data-t="p.edCapasT"></p></li>
        <li><h3 data-t="p.edHold"></h3><p data-t="p.edHoldT"></p></li>
        <li><h3 data-t="p.edEnc"></h3><p data-t="p.edEncT"></p></li>
        <li><h3 data-t="p.edMacros"></h3><p data-t="p.edMacrosT"></p></li>
        <li><h3 data-t="p.edUnicode"></h3><p data-t="p.edUnicodeT"></p></li>
        <li><h3 data-t="p.edBehav"></h3><p data-t="p.edBehavT"></p></li>
      </ul>
      <div class="entra entra--texto pila pila--junta" style="--d:5">
        <a class="btn btn--claro" href="keymap-studio/" data-t="studio.cta"></a>
        <p class="rotulo" data-t="p.edNota"></p>
      </div>
    </div>
  </section>

  <!-- ============ 5 · HOTSWAP ============ -->
  <section class="escena escena--noche">
    <div class="env centro pila">
      <div class="centro">
        <span class="rotulo entra entra--rotulo" data-t="p.hotLabel"></span>
        <h2 class="titular entra entra--titulo" style="--d:1;margin-top:14px" data-t-html="p.hotTitle"></h2>
      </div>
      <div class="esquema entra entra--pieza" style="--d:2">
        <!-- Dos switches dibujados con su forma real y su zocalo Kailh
             debajo: el Choc es bajo y de vastago plano, el MX es alto y de
             cruz, y esa diferencia es justamente la que decide el tacto.
             Sigue siendo un esquema, y lo dice el rotulo de abajo: no hay
             fotografia de estos switches en el repositorio. -->
        <div class="hot">
          <div class="hot__col">
            <svg class="hot__sw" viewBox="0 0 140 190" role="img" aria-label="Kailh Choc Red">
              <g class="hot__pieza">
                <!-- vastago: en el Choc es una placa plana con ranura -->
                <rect x="47" y="34" width="46" height="22" rx="3" fill="#b8322c"/>
                <rect x="47" y="34" width="46" height="7" rx="3" fill="#d2453e"/>
                <rect x="66" y="38" width="8" height="14" rx="2" fill="#8d231e"/>
                <!-- carcasa superior e inferior: baja y ancha -->
                <rect x="20" y="54" width="100" height="16" rx="3" fill="#2a2d33"/>
                <rect x="14" y="68" width="112" height="30" rx="4" fill="#15171b"/>
                <rect x="14" y="68" width="112" height="4" rx="2" fill="#31353c"/>
                <!-- dos patas metalicas y el poste central de plastico -->
                <rect x="38" y="97" width="6" height="17" rx="1.5" fill="#cbb26a"/>
                <rect x="96" y="97" width="6" height="17" rx="1.5" fill="#cbb26a"/>
                <rect x="64" y="97" width="12" height="12" rx="2" fill="#23262b"/>
              </g>
              <!-- zocalo hotswap sobre la placa -->
              <g class="hot__zocalo">
                <rect x="10" y="126" width="120" height="16" rx="2" fill="#191c21" stroke="#343941" stroke-width="1.5"/>
                <rect x="33" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
                <rect x="91" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
                <rect x="0" y="142" width="140" height="22" rx="2" fill="#401b47"/>
                <rect x="0" y="142" width="140" height="3" fill="#6d2e78"/>
              </g>
            </svg>
            <span class="hot__et">Kailh Choc Red</span>
            <span class="hot__dato"><span data-t="p.swLineal"></span> · low profile</span>
          </div>
          <div class="hot__col hot__col--2">
            <svg class="hot__sw" viewBox="0 0 140 190" role="img" aria-label="MMD Holy Panda">
              <g class="hot__pieza">
                <!-- vastago en cruz, que es lo que distingue un MX -->
                <rect x="63" y="14" width="14" height="34" rx="2" fill="#7a5236"/>
                <rect x="53" y="26" width="34" height="11" rx="2" fill="#7a5236"/>
                <rect x="63" y="14" width="14" height="5" rx="2" fill="#98683f"/>
                <!-- carcasa superior clara, la que le da el nombre -->
                <rect x="28" y="44" width="84" height="30" rx="4" fill="#e6e1d6"/>
                <rect x="28" y="44" width="84" height="5" rx="2" fill="#f3efe7"/>
                <rect x="36" y="40" width="68" height="6" rx="3" fill="#d8d2c4"/>
                <!-- carcasa inferior negra, mas alta que la del Choc -->
                <rect x="20" y="72" width="100" height="30" rx="4" fill="#15171b"/>
                <rect x="20" y="72" width="100" height="4" rx="2" fill="#31353c"/>
                <rect x="30" y="100" width="80" height="6" rx="2" fill="#0e1013"/>
                <rect x="44" y="105" width="6" height="16" rx="1.5" fill="#cbb26a"/>
                <rect x="90" y="105" width="6" height="16" rx="1.5" fill="#cbb26a"/>
                <circle cx="70" cy="110" r="7" fill="#23262b"/>
              </g>
              <g class="hot__zocalo">
                <rect x="10" y="126" width="120" height="16" rx="2" fill="#191c21" stroke="#343941" stroke-width="1.5"/>
                <rect x="39" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
                <rect x="85" y="122" width="16" height="9" rx="2" fill="#cbb26a"/>
                <rect x="0" y="142" width="140" height="22" rx="2" fill="#401b47"/>
                <rect x="0" y="142" width="140" height="3" fill="#6d2e78"/>
              </g>
            </svg>
            <span class="hot__et">MMD Holy Panda</span>
            <span class="hot__dato"><span data-t="p.swTactil"></span> · MX</span>
          </div>
        </div>
        <p class="esquema__nota" data-t="p.hotNota"></p>
      </div>
      <p class="bajada centro entra entra--texto" style="--d:3" data-t="p.hotText"></p>
    </div>
  </section>

  <!-- ============ 6 · LOS CINCO ============
       Carril horizontal con las fotos apoyadas, sin tarjetas. -->
  <section class="escena escena--carta" id="cinco">
    <div class="env">
      <div class="centro">
        <span class="rotulo entra entra--rotulo" data-t="p.losCinco"></span>
        <h2 class="titular entra entra--titulo" style="--d:1;margin-top:14px" data-t="p.catalogoTitle"></h2>
      </div>
    </div>
    <div class="env" style="margin-top:clamp(30px,5svh,56px)">
      <div class="carril entra entra--pieza" style="--d:2" id="carril"></div>
      <div class="acciones" style="margin-top:22px">
        <a class="btn" href="catalogo.html" data-t="p.verTodo"></a>
        <a class="btn btn--suave" href="comparar.html" data-t="p.verComparador"></a>
      </div>
    </div>
  </section>

  <!-- ============ 7 · KEYMAP STUDIO ============ -->
  <section class="escena">
    <div class="env centro pila pila--junta">
      <div class="centro">
        <span class="rotulo entra entra--rotulo">Keymap Studio</span>
        <h2 class="titular entra entra--titulo" style="--d:1;margin-top:14px" data-t-html="studio.title"></h2>
      </div>
      <p class="bajada centro entra entra--texto" style="--d:2" data-t="p.studioText"></p>
      <div class="acciones entra entra--texto" style="--d:3">
        <a class="btn" href="keymap-studio/" data-t="studio.cta"></a>
      </div>
      <p class="rotulo entra entra--rotulo" style="--d:4" data-t="p.repos"></p>
    </div>
  </section>

  <!-- ============ 8 · CONFIANZA ============ -->
  <section class="escena escena--carta">
    <div class="env">
      <div class="cuatro" id="confianza"></div>
    </div>
  </section>
</main>

<footer class="env">
  <div class="pie">
    <p class="nota" id="nota"></p>
    <p data-t="footer.copy"></p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/tienda.js"></script>
<script src="js/sofle.js"></script>
<script src="js/sofle-led.js"></script>
<script src="js/rgb.js"></script>
<script src="js/oled-datos.js"></script>
<script src="js/oled.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);

  const LEYENDAS = [
    [["Q","1"],["W","2"],["E","3"],["R","4"],["T","5"],["Y","6"]],
    [["⇧","⇧"],["A","←"],["S","↓"],["D","↑"],["F","→"],["G","⌫"]],
  ];
  function dibujarCapas() {
    $("#capasFila").innerHTML = LEYENDAS.map((fila, f) =>
      `<div class="capas__fila">${fila.map(([a, b], i) =>
        `<span class="capas__t${f === 1 && i === 0 ? " capas__t--hold" : ""}">
           <span>${a}</span><span>${b}</span>
         </span>`).join("")}</div>`).join("");
  }

  /* El teclado se monta una sola vez: cambiar de idioma no cambia la
     forma del Sofle, y remontarlo perderia el efecto en curso. */
  const teclado = CK_RGB.montar(document.getElementById("kb"));
  CK_OLED.montar(document.getElementById("oledIzq"), document.getElementById("oledDer"));

  function pintar() {
    const productos = CK.productos();
    /* Los cinco estan marcados como `featured`, asi que `find` devolvia
       siempre el primero. El heroe ensena el Retro a proposito: es el
       unico con rotulo serigrafiado y el que mejor se lee en foto. */
    const destacado = productos.find(p => p.id === "sofle-retro") || productos[0];
    const est = CK.stock(destacado);

    $("#nota").textContent = CK.notaPrecios();

    /* El `src` ya viene en el HTML; aqui solo se ajusta el texto
       alternativo al idioma del catalogo. */
    $("#heroImg").alt = `${destacado.name} ${destacado.version || ""}`.trim();

    /* La chapa dice el nombre en tres niveles, el precio DE ENTRADA con su
       "desde" delante, y el stock. Y lleva al anuncio concreto. */
    $("#chapa").href = CK.enlaceCompra(destacado);
    $("#chapa").innerHTML = `
      <span>${CK.rotulo(destacado)}</span>
      <span class="chapa__sep" aria-hidden="true"></span>
      <span>${CK.precioHTML(destacado)}</span>
      <span class="chapa__sep" aria-hidden="true"></span>
      <em>${CK.escapar(est.txt)}</em>`;

    /* Sin `loading="lazy"`: las cinco fotos viven dentro de un carril con
       `overflow-x:auto`, y ahi el navegador considera que las cuatro que
       no se ven estan fuera de pantalla y no las carga nunca. Son cinco
       imagenes pequenas; cargarlas es mas barato que el fallo. */
    $("#carril").innerHTML = productos.map(p => {
      const e = CK.stock(p);
      return `
        <a href="modelo.html?id=${p.id}">
          <img src="${CK.foto(p, true)}" alt="${CK.escapar((p.name + " " + (p.version || "")).trim())}" data-foco="${p.foco ?? 50}">
          <div>
            <h3>${CK.rotulo(p)}</h3>
            <p class="precio">${CK.precioHTML(p)}</p>
            <p class="estado ${e.clase}">${CK.escapar(e.txt)}</p>
          </div>
        </a>`;
    }).join("");

    $("#confianza").innerHTML = [
      ["trust.shipping","trust.shippingText"],["trust.warranty","trust.warrantyText"],
      ["trust.custom","trust.customText"],["trust.firmware","trust.firmwareText"],
    ].map(([a,b],i)=>`<div class="entra entra--texto" style="--d:${i}"><h3>${CK.t(a)}</h3><p>${CK.t(b)}</p></div>`).join("");

    dibujarCapas();
    CK.encuadrarTodo();

    /* El modo que esta a la altura de los ojos se enciende, y el teclado
       fijado cambia al efecto de ese modo. Sin escuchar el scroll: lo
       resuelve el observador con un margen que deja activa solo la banda
       central de la pantalla. */
    const ioPaso = new IntersectionObserver(es => {
      for (const e of es) {
        e.target.classList.toggle("viva", e.isIntersecting);
        /* `data-fx` vacio = RGB apagado. El primer paso ensena el teclado
           negro, sin luz, que es como esta cuando lo sacas de la caja. */
        if (e.isIntersecting && e.target.dataset.fx !== undefined) teclado.modo(e.target.dataset.fx || null);
      }
    }, { rootMargin: "-42% 0px -42% 0px" });
    document.querySelectorAll(".paso").forEach(p => ioPaso.observe(p));

    CK.observarEntradas();
  }

  CK.montarSelectorIdioma();
  CK.pintarIdioma(pintar);
  pintar();
})();
</script>
</body>
</html>
