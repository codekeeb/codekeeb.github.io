<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codekeeb · Portada — teclados split ergonómicos hechos a mano</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Martian+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portada.css">
</head>
<body>

<header class="top">
  <div class="top__in envoltura">
    <a class="marca" href="index.html">CODE<i>/</i>KEEB</a>
    <nav class="top__nav">
      <a href="#ventajas" data-t="p.navVentajas">Ventajas</a>
      <a href="a.html" data-t="nav.models">Modelos</a>
      <a href="b.html" data-t="d.compare">Comparar</a>
    </nav>
    <span class="top__sp"></span>
    <div class="idiomas" role="group" aria-label="Idioma">
      <button data-lang-btn="es">ES</button>
      <button data-lang-btn="en">EN</button>
      <button data-lang-btn="fr">FR</button>
    </div>
    <a class="btn btn--solido" id="tienda" href="#" data-t="nav.buy">Comprar</a>
  </div>
</header>

<main>

  <!-- ============ HERO ============
       Ni carrusel ni foto a sangre: un titular que dice la promesa,
       la foto del modelo destacado dentro de su marco, y dos puertas
       — catalogo y comparador. -->
  <section class="hero envoltura">
    <div class="hero__in">
      <div>
        <span class="rotulo entra entra--rotulo" data-t="p.heroKicker"></span>
        <h1 class="entra entra--titulo" style="--d:1" data-t-html="p.heroTitle"></h1>
        <p class="hero__texto entra entra--texto" style="--d:2" data-t="p.heroText"></p>
        <div class="hero__acciones entra entra--texto" style="--d:3">
          <a class="btn btn--solido" href="a.html" data-t="p.heroCta"></a>
          <a class="btn btn--linea" href="b.html" data-t="p.heroCta2"></a>
        </div>
        <div class="hero__cifras entra entra--dato" style="--d:4" id="cifras"></div>
      </div>
      <figure class="marco entra entra--demo" style="--d:2" id="heroFoto"></figure>
    </div>
    <div class="tira" id="tira"></div>
  </section>

  <!-- ============ VENTAJAS ============
       Cada una con su demostracion funcionando al lado. Los esquemas
       estan dibujados con CSS y rotulados: no son fotos del producto. -->
  <section class="region region--carta" id="ventajas">
    <div class="envoltura">
      <div class="region__cab">
        <span class="rotulo entra entra--rotulo" data-t="p.rgbLabel"></span>
        <h2 class="entra entra--titulo" style="--d:1" data-t="p.ventajas"></h2>
        <p class="entra entra--texto" style="--d:2" data-t="p.ventajasText"></p>
      </div>

      <!-- 1 · el degradado cruza las dos mitades -->
      <article class="ventaja">
        <div class="ventaja__demo entra entra--demo">
          <div class="demo">
            <span class="demo__et" data-t="p.rgbLabel"></span>
            <div class="kb">
              <div class="kb__luz" aria-hidden="true"></div>
              <div class="kb__placa" id="kbPlaca" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <div class="ventaja__texto">
          <span class="rotulo entra entra--rotulo" data-t="p.rgbLabel"></span>
          <h3 class="entra entra--titulo" style="--d:1" data-t-html="p.rgbTitle"></h3>
          <p class="entra entra--texto" style="--d:2" data-t="p.rgbText"></p>
          <span class="nota entra entra--texto" style="--d:3" data-t="p.demoNota"></span>
        </div>
      </article>

      <!-- 2 · las cuatro vistas del OLED -->
      <article class="ventaja ventaja--giro">
        <div class="ventaja__demo entra entra--demo">
          <div class="demo">
            <span class="demo__et" data-t="p.oledLabel"></span>
            <div class="oled" aria-hidden="true">
              <div class="oled__v"><small>Bat</small><b>82%</b><span class="oled__bar"><i></i></span></div>
              <div class="oled__v"><small>Capa</small><b>2</b></div>
              <div class="oled__v"><small>WPM</small><b>96</b></div>
              <div class="oled__v"><span class="gato"><span class="gato__cara"><i class="gato__ojo gato__ojo--i"></i><i class="gato__ojo gato__ojo--d"></i></span><i></i><i></i><span class="gato__mesa"></span></span><small>Bongo Cat</small></div>
            </div>
          </div>
        </div>
        <div class="ventaja__texto">
          <span class="rotulo entra entra--rotulo" data-t="p.oledLabel"></span>
          <h3 class="entra entra--titulo" style="--d:1" data-t-html="p.oledTitle"></h3>
          <p class="entra entra--texto" style="--d:2" data-t="p.oledText"></p>
          <span class="nota entra entra--texto" style="--d:3" data-t="p.demoNota"></span>
        </div>
      </article>

      <!-- 3 · las capas -->
      <article class="ventaja">
        <div class="ventaja__demo entra entra--demo">
          <div class="demo">
            <span class="demo__et" data-t="p.capasLabel"></span>
            <div class="capas">
              <div id="capasFila" aria-hidden="true"></div>
              <p class="capas__pie" aria-hidden="true">
                <span data-t="p.capasLabel"></span>
                <b><span>1</span><span>2</span></b>
              </p>
            </div>
          </div>
        </div>
        <div class="ventaja__texto">
          <span class="rotulo entra entra--rotulo" data-t="p.capasLabel"></span>
          <h3 class="entra entra--titulo" style="--d:1" data-t-html="p.capasTitle"></h3>
          <p class="entra entra--texto" style="--d:2" data-t="p.capasText"></p>
          <span class="nota entra entra--texto" style="--d:3" data-t="p.demoNota"></span>
        </div>
      </article>

      <!-- 4 · hotswap -->
      <article class="ventaja ventaja--giro">
        <div class="ventaja__demo entra entra--demo">
          <div class="demo">
            <span class="demo__et" data-t="p.hotLabel"></span>
            <div class="hot" aria-hidden="true">
              <div class="hot__col">
                <span class="hot__hueco">
                  <span class="hot__socket"><i></i><i></i></span>
                  <span class="hot__sw hot__sw--rojo"></span>
                </span>
                <span class="hot__et">Choc Red</span>
              </div>
              <div class="hot__col">
                <span class="hot__hueco">
                  <span class="hot__socket"><i></i><i></i></span>
                  <span class="hot__sw hot__sw--marron" style="animation-delay:1.6s"></span>
                </span>
                <span class="hot__et">MMD Holy Panda</span>
              </div>
            </div>
          </div>
        </div>
        <div class="ventaja__texto">
          <span class="rotulo entra entra--rotulo" data-t="p.hotLabel"></span>
          <h3 class="entra entra--titulo" style="--d:1" data-t-html="p.hotTitle"></h3>
          <p class="entra entra--texto" style="--d:2" data-t="p.hotText"></p>
          <span class="nota entra entra--texto" style="--d:3" data-t="p.demoNota"></span>
        </div>
      </article>
    </div>
  </section>

  <!-- ============ CATALOGO Y COMPARADOR ============ -->
  <section class="region">
    <div class="envoltura">
      <div class="region__cab">
        <h2 class="entra entra--titulo" data-t="p.catalogoTitle"></h2>
        <p class="entra entra--texto" style="--d:1" data-t="p.catalogoText"></p>
      </div>
      <div class="dos">
        <article class="puerta entra entra--demo">
          <h3 data-t="p.verCatalogo"></h3>
          <p data-t="d.lede"></p>
          <a class="btn btn--solido" href="a.html" data-t="p.heroCta"></a>
        </article>
        <article class="puerta entra entra--demo" style="--d:1">
          <h3 data-t="p.verComparador"></h3>
          <p data-t="d.compareLede"></p>
          <a class="btn btn--linea" href="b.html" data-t="p.heroCta2"></a>
        </article>
      </div>
    </div>
  </section>

  <!-- ============ KEYMAP STUDIO ============ -->
  <section class="region region--carta">
    <div class="envoltura">
      <div class="region__cab">
        <span class="rotulo entra entra--rotulo">Keymap Studio</span>
        <h2 class="entra entra--titulo" style="--d:1" data-t-html="studio.title"></h2>
        <p class="entra entra--texto" style="--d:2" data-t="p.studioText"></p>
      </div>
      <div class="hero__acciones entra entra--texto" style="--d:3">
        <a class="btn btn--solido" href="../keymap-studio/" data-t="studio.cta"></a>
        <span class="nota" style="align-self:center;margin:0" data-t="p.repos"></span>
      </div>
    </div>
  </section>

  <!-- ============ CONFIANZA ============ -->
  <section class="region">
    <div class="envoltura">
      <div class="confianza" id="confianza"></div>
    </div>
  </section>
</main>

<footer class="envoltura">
  <div class="pie">
    <p class="nota" id="nota"></p>
    <p data-t="footer.copy"></p>
  </div>
</footer>

<script src="../js/data.js"></script>
<script src="../js/i18n.js"></script>
<script src="comun.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);

  /* El esquema del teclado: seis columnas por mitad, cuatro filas. Es un
     dibujo, no un mapa exacto — por eso lleva rotulo de esquema. */
  function dibujarPlaca() {
    const mitad = () => `<div class="kb__mitad">${
      Array.from({ length: 24 }, () => `<span class="kb__tecla"></span>`).join("")}</div>`;
    $("#kbPlaca").innerHTML = mitad() + mitad();
  }

  /* Las capas: seis teclas con dos juegos de leyendas que se alternan.
     La primera es la que se mantiene pulsada para saltar de capa. */
  const LEYENDAS = [
    [["Q","1"],["W","2"],["E","3"],["R","4"],["T","5"],["Y","6"]],
    [["⇧","⇧"],["A","←"],["S","↓"],["D","↑"],["F","→"],["G","⌫"]],
  ];
  function dibujarCapas() {
    $("#capasFila").innerHTML = LEYENDAS.map((fila, f) =>
      `<div class="capas__fila">${fila.map(([a, b], i) =>
        `<span class="capas__t${f === 1 && i === 0 ? " capas__t--hold" : ""}">
           <span>${a}</span><span>${b}</span>
         </span>`).join("")}</div>`).join("");
  }

  function pintar() {
    const productos = CK.productos();
    const destacado = productos.find(p => p.featured) || productos[0];

    $("#tienda").href = CK.tiendaURL;
    $("#nota").textContent = CK.notaPrecios();

    /* Las cifras del heroe salen del catalogo, no escritas a mano: si
       manana entra un sexto modelo, el numero cambia solo. */
    const conStock = productos.filter(p => p.stock > 0).length;
    $("#cifras").innerHTML = [
      [productos.length, CK.t("nav.models")],
      [conStock, CK.t("p.enStock")],
      ["ZMK", CK.t("trust.firmware")],
      ["3", CK.t("p.idiomas")],
    ].map(([n, t]) => `<div><b>${CK.escapar(n)}</b><span>${CK.escapar(t)}</span></div>`).join("");

    const est = CK.stock(destacado);
    $("#heroFoto").innerHTML = `
      <div class="marco__foto">
        <img src="${CK.foto(destacado)}" alt="${CK.escapar(destacado.name)}" width="1200" height="900">
      </div>
      <figcaption class="marco__pie">
        <span><b>${CK.escapar(destacado.name)}</b> · ${CK.escapar(destacado.version || "")}</span>
        <span>${CK.precio(destacado.priceFrom ?? destacado.priceFull)} · ${CK.escapar(est.txt)}</span>
      </figcaption>`;

    $("#tira").innerHTML = productos.map(p => `
      <a href="../modelo.html?id=${p.id}">
        <span class="tira__foto"><img src="${CK.foto(p, true)}" alt="${CK.escapar(p.name)}" loading="lazy" width="600" height="450"></span>
        <b>${CK.escapar(p.title?.model || p.name)}</b>
        <span>${CK.escapar(p.title?.trait || p.version || "")}</span>
        <span class="tira__precio mono">${CK.precio(p.priceFrom ?? p.priceFull)}</span>
      </a>`).join("");

    $("#confianza").innerHTML = [
      ["trust.shipping","trust.shippingText"],["trust.warranty","trust.warrantyText"],
      ["trust.custom","trust.customText"],["trust.firmware","trust.firmwareText"],
    ].map(([a,b],i)=>`<div class="entra entra--texto" style="--d:${i}"><h3>${CK.t(a)}</h3><p>${CK.t(b)}</p></div>`).join("");

    dibujarPlaca();
    dibujarCapas();

    /* Los marcos de foto entran aparte: el marco se queda quieto y lo
       que se asienta es la imagen de dentro. */
    const ioFoto = new IntersectionObserver(es => {
      for (const e of es) if (e.isIntersecting) { e.target.classList.add("dentro"); ioFoto.unobserve(e.target); }
    }, { threshold: 0.12 });
    document.querySelectorAll(".marco, .tira a").forEach(m => ioFoto.observe(m));

    CK.observarEntradas();
  }

  CK.pintarIdioma(pintar);
  pintar();
})();
</script>
</body>
</html>
