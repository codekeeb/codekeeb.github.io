<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codekeeb · Dirección C — Una ficha por pantalla</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Martian+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="c.css">
</head>
<body>

<header class="top">
  <div class="top__in envoltura">
    <a class="marca" href="index.html">CODE<i>/</i>KEEB</a>
    <span class="top__sp"></span>
    <div class="idiomas" role="group" aria-label="Idioma">
      <button data-lang-btn="es">ES</button>
      <button data-lang-btn="en">EN</button>
      <button data-lang-btn="fr">FR</button>
    </div>
    <a class="btn btn--solido" href="a.html" data-t="d.choose">Elige tu split</a>
  </div>
</header>

<nav class="indice" id="indice" aria-label="Modelos"></nav>

<main class="carril" id="carril"></main>

<footer class="cierre">
  <div class="envoltura cierre__in">
    <h2 data-t-html="studio.title"></h2>
    <div class="herramienta">
      <a class="btn btn--solido" href="../keymap-studio/" data-t="studio.cta"></a>
      <p style="color:var(--gris);font-size:.85rem" data-t="studio.note"></p>
    </div>
    <div class="confianza" id="confianza"></div>
  </div>
  <div class="envoltura"><div class="pie">
    <p class="nota" id="nota"></p>
    <p data-t="footer.copy"></p>
  </div></div>
</footer>

<script src="../js/data.js"></script>
<script src="../js/i18n.js"></script>
<script src="comun.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);

  /* Cinco datos por ficha. Se piden por etiqueta y los que un modelo no
     trae se caen solos: el Corne v3 tiene 5 fichas y el Sofle Carbon 10,
     asi que una lista fija dejaria huecos raros. */
  const PREFERIDAS = ["Teclas", "Switches", "Conexión", "Iluminación", "Batería", "Case", "Encoders", "Firmware", "Perfil"];

  function ficha(p, i, total) {
    const est = CK.stock(p);
    const desde = p.priceFrom != null && p.priceFull != null && p.priceFrom < p.priceFull;
    const specs = PREFERIDAS
      .map(k => {
        const par = (p.specs || []).find(s => s[0].es === k);
        return par ? `<div><dt>${CK.escapar(CK.L(par[0]))}</dt><dd>${CK.escapar(CK.L(par[1]))}</dd></div>` : "";
      })
      .filter(Boolean).slice(0, 5).join("");

    return `
      <section class="ficha" id="m${i + 1}" aria-label="${CK.escapar(p.name)}">
        <div class="ficha__in envoltura">
          <figure class="ficha__foto">
            <img src="${CK.foto(p)}" alt="${CK.escapar(p.name)}" data-foco="${p.foco ?? 50}"
                 loading="${i < 1 ? "eager" : "lazy"}">
            <figcaption class="ficha__num">${String(i + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}</figcaption>
          </figure>
          <div class="ficha__datos">
            <h2 class="nombre entra entra--titulo">${CK.rotulo(p)}</h2>
            <p class="desc entra entra--texto" style="--d:1">${CK.escapar(CK.L(p.desc) || "")}</p>
            <div class="precio entra entra--texto" style="--d:2">
              ${desde ? `<span class="precio__desde">${CK.t("price.from")}</span>` : ""}
              <span class="precio__n">${CK.precio(p.priceFrom ?? p.priceFull)}</span>
              ${p.priceOriginal ? `<s class="precio__antes">${CK.precio(p.priceOriginal)}</s>` : ""}
              ${p.discountPct ? `<span class="precio__off">−${p.discountPct}%</span>` : ""}
            </div>
            <p class="estado ${est.clase} entra entra--texto" style="--d:2">${CK.escapar(est.txt)}</p>
            <dl class="specs entra entra--datos" style="--d:3">${specs}</dl>
            <div class="acciones entra entra--texto" style="--d:4">
              <a class="btn btn--solido" href="${p.url}" target="_blank" rel="noopener">${CK.t("cta.buy")}</a>
              <a class="btn btn--linea" href="../modelo.html?id=${p.id}">${CK.t("models.details")}</a>
            </div>
          </div>
        </div>
      </section>`;
  }

  function pintar() {
    const lista = CK.productos();
    $("#nota").textContent = CK.notaPrecios();
    $("#carril").innerHTML = lista.map((p, i) => ficha(p, i, lista.length)).join("");

    $("#indice").innerHTML = lista.map((p, i) =>
      `<a href="#m${i + 1}" data-i="${i + 1}"><span>${CK.escapar(p.title?.model || p.name)}</span>${String(i + 1).padStart(2, "0")}</a>`).join("");

    $("#confianza").innerHTML = [
      ["trust.shipping","trust.shippingText"],["trust.warranty","trust.warrantyText"],
      ["trust.custom","trust.customText"],["trust.firmware","trust.firmwareText"],
    ].map(([a,b],i)=>`<div class="entra entra--texto" style="--d:${i}"><h3>${CK.t(a)}</h3><p>${CK.t(b)}</p></div>`).join("");

    /* La foto entra aparte del texto: el marco no se mueve nunca. */
    const ioFoto = new IntersectionObserver(es => {
      for (const e of es) if (e.isIntersecting) { e.target.classList.add("dentro"); ioFoto.unobserve(e.target); }
    }, { threshold: 0.15 });
    document.querySelectorAll(".ficha__foto").forEach(f => ioFoto.observe(f));

    /* El indice marca la ficha que ocupa el centro de la pantalla. */
    const ioIdx = new IntersectionObserver(es => {
      for (const e of es) {
        if (!e.isIntersecting) continue;
        const n = e.target.id.replace("m", "");
        $("#indice").querySelectorAll("a").forEach(a =>
          a.setAttribute("aria-current", String(a.dataset.i === n)));
      }
    }, { rootMargin: "-45% 0px -45% 0px" });
    document.querySelectorAll(".ficha").forEach(f => ioIdx.observe(f));

    CK.encuadrarTodo();
    CK.observarEntradas();
  }

  CK.pintarIdioma(pintar);
  pintar();
})();
</script>
</body>
</html>
