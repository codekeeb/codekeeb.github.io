<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Codekeeb — Teclados split ergonómicos hechos a mano</title>
<meta name="description" content="Teclado split ergonómico montado y probado a mano. Configúralo, mira qué incluye cada opción y compáralo con los otros modelos.">
<meta property="og:type" content="product">
<meta property="og:site_name" content="Codekeeb">
<meta property="og:title" content="Codekeeb — Teclados split ergonómicos hechos a mano">
<meta property="og:description" content="Teclado split ergonómico montado y probado a mano. Configúralo, mira qué incluye cada opción y compáralo con los otros modelos.">
<meta property="og:image" content="https://codekeeb.github.io/assets/img/products/sofle-retro.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#ffffff">
<!-- Seguridad: la pagina solo carga lo suyo. Si un dia se anade un
     servicio externo, hay que darlo de alta aqui Y en privacidad.html. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preload" href="assets/fonts/schibstedgrotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/doto-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/fuentes.css">
<link rel="stylesheet" href="css/aparato.css">
</head>
<body>
<a class="saltar" href="#pagina" data-t="a11y.saltar">Saltar al contenido</a>

<!-- Una sola barra: la marca, los cinco modelos como fichas de color (el que
     miras, relleno) y los ajustes. Sustituye a las tres barras apiladas de
     antes, que se comian 250 px antes de ver el teclado. -->
<header class="f-top">
  <a class="f-marca" href="/" aria-label="Codekeeb">
    <img src="assets/brand/logo-horizontal-dark.png"
         srcset="assets/brand/logo-horizontal-dark.png 1x, assets/brand/logo-horizontal-dark@2x.png 2x"
         width="640" height="224" alt="CODE/KEEB">
  </a>
  <nav class="f-modelos" aria-label="Modelos" data-t-aria="nav.models"><ul id="modelos"></ul></nav>
  <div class="f-ajustes">
    <a class="f-studio" href="keymap-studio/">Keymap Studio</a>
    <button type="button" class="f-pausa" data-pausa hidden></button>
    <div class="idiomas">
      <button class="idiomas__d" data-lang-disparador aria-haspopup="true" aria-expanded="false" aria-label="Idioma" data-t-aria="a11y.idioma">
        <span data-lang-actual>ES</span>
        <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="idiomas__m" data-lang-menu role="menu" hidden>
        <button data-lang-btn="es">Español</button>
        <button data-lang-btn="en">English</button>
      </div>
    </div>
  </div>
</header>

<main id="pagina">

  <!-- La placa del aparato: el color del modelo a sangre, su nombre como
       etiqueta, sus cuatro datos y la pantalla con el precio. -->
  <section class="f-placa" id="que" aria-labelledby="nombre">
    <div class="f-placa__in">
      <div class="f-placa__texto">
        <h1 class="f-nombre" id="nombre"></h1>
        <p class="f-rasgo" id="rasgo"></p>
        <p class="f-desc" id="desc"></p>
        <ul class="f-lecturas" id="lecturas"></ul>
        <div class="f-compra">
          <div class="f-pantalla" id="precioCab"></div>
          <a class="f-tecla f-tecla--placa" href="#configura" data-t="p2.configurar"></a>
        </div>
        <p class="f-estado" id="estado"></p>
        <p class="f-manual" id="manual" hidden><a class="f-enlace" data-t="man.enlace"></a></p>
      </div>
      <div class="f-ventana">
        <div class="f-ventana__foto" id="foto"></div>
        <div class="f-miniaturas" id="miniaturas"></div>
      </div>
    </div>
  </section>

  <!-- El configurador: modulos numerados (el orden es el de la compra) con
       teclas de aparato; el resumen y la pantalla del total, al lado. -->
  <section class="f-seccion f-config" id="configura" aria-labelledby="h-config">
    <div class="f-in">
      <h2 class="f-h2" id="h-config"></h2>
      <p class="f-lede" data-t="e.configuraP"></p>
      <form class="f-config__rejilla" id="config">
        <div class="f-modulos">
          <fieldset class="f-modulo">
            <legend><span class="f-num">01</span><span data-t="m.nivel"></span></legend>
            <div class="f-opciones" id="niveles"></div>
          </fieldset>
          <fieldset class="f-modulo" id="pasoKeycaps" hidden>
            <legend><span class="f-num">02</span><span data-t="m.keycaps"></span></legend>
            <div class="f-opciones" id="keycaps"></div>
          </fieldset>
          <div class="f-modulo">
            <p class="f-modulo__t"><span class="f-num" id="numSw">02</span><span data-t="m.switches"></span></p>
            <div id="switches"></div>
          </div>
        </div>
        <div class="f-resumen" id="incluye">
          <h3 data-t="e.incluyeT"></h3>
          <ul class="f-incluye" id="incluyeLista"></ul>
          <div class="f-pantalla f-pantalla--total">
            <span class="f-pantalla__et" data-t="m.total"></span>
            <span class="f-pantalla__cifra" id="total"></span>
            <small id="totalNota" hidden></small>
          </div>
          <a class="f-tecla f-tecla--modelo" id="comprar" target="_blank" rel="noopener"><span data-t="m.comprar"></span><span id="icExt"></span></a>
          <p class="f-nota"><span data-t="m.notaEtsy"></span> <span id="fecha"></span></p>
        </div>
      </form>
    </div>
  </section>

  <!-- Lo que hace su firmware, en pantallas de verdad: solo sale lo que la
       ficha del modelo declara. -->
  <section class="f-seccion f-firmware" id="firmware" aria-labelledby="h-firmware" hidden>
    <div class="f-in">
      <h2 class="f-h2" id="h-firmware" data-t="f.firmwareT"></h2>
      <div class="f-aparatos">
        <article class="f-aparato f-aparato--luz" id="p-luz" hidden>
          <h3 data-t-html="p.rgbTitle"></h3>
          <div class="f-aparato__pantalla"><div class="kb" id="kb"></div></div>
          <div class="modos" id="modos" role="group" aria-label="Modos de luz" data-t-aria="p3.modosLuz"></div>
          <p id="fxTexto"></p>
          <p class="f-nota" data-t="p.rgbReal"></p>
        </article>
        <article class="f-aparato f-aparato--oled" id="p-oled" hidden>
          <h3 data-t-html="p.oledTitle"></h3>
          <div class="oleds">
            <figure class="oled"><div class="oled__marco"><canvas id="oledIzq" width="68" height="160" aria-hidden="true"></canvas></div><figcaption data-t="p.oledIzq"></figcaption></figure>
            <figure class="oled"><div class="oled__marco"><canvas id="oledDer" width="68" height="160" aria-hidden="true"></canvas></div><figcaption data-t="p.oledDer"></figcaption></figure>
          </div>
          <p class="f-nota" data-t="p.oledReal"></p>
        </article>
        <article class="f-aparato f-aparato--studio" id="p-studio" hidden>
          <h3>Keymap Studio</h3>
          <p data-t="f.studioP"></p>
          <a class="f-tecla f-tecla--tinta" href="keymap-studio/" data-t="f.studioA"></a>
        </article>
      </div>
    </div>
  </section>

  <!-- La ficha como hoja de datos: parametro y valor, sin adornos. -->
  <section class="f-seccion" id="ficha" aria-labelledby="h-ficha">
    <div class="f-in">
      <h2 class="f-h2" id="h-ficha" data-t="e.fichaT"></h2>
      <div class="f-hoja">
        <table class="f-datos">
          <thead><tr><th scope="col" data-t="f.parametro"></th><th scope="col" data-t="f.valor"></th></tr></thead>
          <tbody id="fichaLista"></tbody>
          <tbody id="compLista"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="f-seccion f-seccion--gris" id="comparar" aria-labelledby="h-comparar">
    <div class="f-in">
      <h2 class="f-h2" id="h-comparar" data-t="m.sComparT"></h2>
      <p class="f-lede" data-t="m.sComparP"></p>
      <div class="tabla-env" tabindex="0" role="region" aria-labelledby="h-comparar"><table class="tabla" id="comparativa"></table></div>
      <p><a class="f-enlace" href="comparar.html"><span data-t="m.verComparador"></span><span class="ic-flecha"></span></a></p>
    </div>
  </section>

  <section class="f-seccion" aria-labelledby="h-conf">
    <div class="f-in">
      <h2 class="f-h2" id="h-conf" data-t="m.sEnvio"></h2>
      <ul class="confianza" id="confianza"></ul>
    </div>
  </section>
</main>

<footer class="f-pie">
  <div class="f-in f-pie__in">
    <p id="notaPrecios"></p>
    <nav aria-label="Pie" data-t-aria="a11y.pie">
      <a href="/#tienda" data-t="m.tienda">Tienda</a>
      <a href="comparar.html" data-t="d.compare">Comparar</a>
      <a href="manual.html" data-t="man.modelos">Manuales</a>
      <a href="keymap-studio/">Keymap Studio</a>
    </nav>
    <nav class="f-pie__legal" aria-label="Legal">
      <a href="legal.html#aviso" data-t="l.aviso">Aviso legal</a>
      <a href="legal.html#privacidad" data-t="l.privacidad">Privacidad</a>
      <a href="legal.html#cookies" data-t="l.cookies">Cookies</a>
      <a href="legal.html#compras" data-t="l.compras">Compras y devoluciones</a>
    </nav>
  </div>
</footer>

<!-- Barra de compra: aparece cuando la placa ya no se ve. -->
<div class="f-barra" id="cbarra" inert>
  <div class="f-barra__in">
    <span class="f-barra__nombre" id="cbNombre"></span>
    <span class="f-barra__precio" id="cbTotal"></span>
    <a class="f-tecla f-tecla--modelo" id="cbComprar" target="_blank" rel="noopener" data-t="m.comprar"></a>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/tienda.js"></script>
<script src="js/geometria.js"></script>
<script src="js/sofle-led.js"></script>
<script src="js/rgb.js"></script>
<script src="js/oled-datos.js"></script>
<script src="js/oled.js"></script>
<script src="js/modelo.js"></script>
</body>
</html>
